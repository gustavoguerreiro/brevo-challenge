id: automations.add_rule_conditional_split
domain: automations
summary: Add the rule step 'Divisão condicional' (Regras) to an automation. UI only.
ui_label_pt: Divisão condicional
risk: write
reversible: true
requires_human_confirmation: false
plan_availability:
  free: available
preconditions:
- A draft automation exists (automations.create_automation) and its editor is open at /automation/edit/<id>.
- The automation has a trigger (see the configure_trigger_* actions).
- 'Branch B is the ''else'' branch: contacts matching no condition. ''Adicionar ramificação'' (more branches) is
  crown-gated.'
inputs:
  type: object
  required:
  - automation_id
  properties:
    automation_id:
      type: integer
      description: ID of the draft automation, as shown in /automation/edit/<id>.
    config:
      type: object
      properties:
        branch_a_filters:
          type: array
          description: UI label 'Ramificação A > Adicionar filtro'. Filter builder, same family as segment filters
            (inferred).
          items:
            type: string
        branch_a_name:
          type: string
          description: UI label 'Ramificação A (rename)'.
      required:
      - branch_a_filters
    after_step_id:
      type: integer
      description: Optional. Step to attach the block after; by default the block goes at the end of the flow.
outputs:
  type: object
  properties:
    step_id:
      type: integer
      description: 'Shown as ''ID da etapa #N'' in the panel. IDs are allocated at drop time and are not reused
        after an undo.'
side_effects:
- 'Expected (from the label, not seen): changes the draft only. Nothing runs while the automation is inactive (Desativada).'
postcondition_check: The canvas card shows the saved choice instead of the orange 'Defina e salve essa ação.', and
  the header reads 'Salva hoje às HH:MM'.
errors:
- condition: Step left unsaved or incomplete
  symptom: Card shows 'Defina e salve essa ação.' in orange.
  recovery: Open the card, fill the required fields and press Salvar, or remove the card with the undo arrow or
    the card menu.
limits: []
depends_on:
- automations.create_automation
execution:
  preferred: ui
  ui:
    entry: /automation/edit/<automation_id>
    steps:
    - Open /automation/edit/<automation_id>.
    - In the palette choose the tab 'Regras' (or type part of the name in 'Buscar por nome da etapa').
    - Drag the block 'Divisão condicional' onto the dashed zone 'Solte o bloco aqui' between two steps, or on a
      connector.
    - Wait about 3 seconds after any undo before dragging again, otherwise the editor can stay stuck in the drag
      state until the page is reloaded.
    - 'In the side panel fill: ''Ramificação A > Adicionar filtro''*; ''Ramificação A (rename)''.'
    - Press 'Salvar' in the panel. 'Cancelar' leaves an unsaved card marked 'Defina e salve essa ação.'.
provenance:
  sources:
  - ui
  verification: observed_not_executed
  verified_at: '2026-10-22'
  evidence: evidence/automations.build_steps.json
  notes: The block was dropped and its settings panel was read, then cancelled. The save was not exercised.
