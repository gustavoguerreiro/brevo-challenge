id: automations.add_action_add_contact_to_list
domain: automations
summary: Add the action step 'Adicionar um contato a uma lista' (Contatos) to an automation. UI only.
ui_label_pt: Adicionar um contato a uma lista
risk: write
reversible: true
requires_human_confirmation: false
plan_availability:
  free: available
preconditions:
- A draft automation exists (automations.create_automation) and its editor is open at /automation/edit/<id>.
- The automation has a trigger (see the configure_trigger_* actions).
- Executed and saved with list 6.
inputs:
  type: object
  required:
  - automation_id
  properties:
    automation_id:
      type: integer
      description: ID of the draft automation, as shown in /automation/edit/<id>.
    config:
      type: object
      properties:
        list_ids:
          type: array
          description: UI label 'Escolha de suas listas'. Multi-select of list IDs, grouped by folder.
          items:
            type: string
      required:
      - list_ids
    after_step_id:
      type: integer
      description: Optional. Step to attach the block after; by default the block goes at the end of the flow.
outputs:
  type: object
  properties:
    step_id:
      type: integer
      description: 'Shown as ''ID da etapa #N'' in the panel. IDs are allocated at drop time and are not reused
        after an undo.'
side_effects:
- 'Changes the draft only. Observed: nothing ran and the automation stayed inactive (Desativada).'
- 'Expected (not seen; no automation was ever activated): once the automation is activated, adds every contact that
  reaches the step to the chosen lists once the automation runs.'
postcondition_check: The canvas card shows the saved choice instead of the orange 'Defina e salve essa ação.', and
  the header reads 'Salva hoje às HH:MM'.
errors:
- condition: Step left unsaved or incomplete
  symptom: Card shows 'Defina e salve essa ação.' in orange.
  recovery: Open the card, fill the required fields and press Salvar, or remove the card with the undo arrow or
    the card menu.
limits: []
depends_on:
- automations.create_automation
execution:
  preferred: ui
  ui:
    entry: /automation/edit/<automation_id>
    steps:
    - Open /automation/edit/<automation_id>.
    - In the palette choose the tab 'Ações' (or type part of the name in 'Buscar por nome da etapa').
    - Drag the block 'Adicionar um contato a uma lista' onto the dashed zone 'Solte o bloco aqui' between two steps,
      or on a connector.
    - Wait about 3 seconds after any undo before dragging again, otherwise the editor can stay stuck in the drag
      state until the page is reloaded.
    - 'In the side panel fill: ''Escolha de suas listas''*.'
    - Press 'Salvar' in the panel. 'Cancelar' leaves an unsaved card marked 'Defina e salve essa ação.'.
provenance:
  sources:
  - ui
  verification: executed_verified
  verified_at: '2026-10-22'
  evidence: evidence/automations.build_steps.json
  verified_via:
  - ui
  notes: Dropped, configured and saved on the inactive draft automation; the canvas card showed the choice.
description: Adding this step only changes the draft. What it does to contacts starts when the automation is activated
  (automations.activate_automation), and activation always needs an explicit human yes.
