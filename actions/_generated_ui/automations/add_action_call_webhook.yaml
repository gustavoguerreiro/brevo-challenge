id: automations.add_action_call_webhook
domain: automations
summary: Add the action step 'Chamar um webhook' (Webhooks) to an automation. UI only.
ui_label_pt: Chamar um webhook
risk: write
reversible: true
requires_human_confirmation: false
plan_availability:
  free: available
preconditions:
- A draft automation exists (automations.create_automation) and its editor is open at /automation/edit/<id>.
- The automation has a trigger (see the configure_trigger_* actions).
inputs:
  type: object
  required:
  - automation_id
  properties:
    automation_id:
      type: integer
      description: ID of the draft automation, as shown in /automation/edit/<id>.
    config:
      type: object
      properties:
        url:
          type: string
          description: UI label 'URL'. Format https://example.com
        auth_method:
          type: string
          description: UI label 'Método de autenticação'. Default 'Sem autenticação'.
        headers:
          type: array
          description: UI label 'Adicionar objeto'. Extra headers (inferred from the label).
          items:
            type: string
        include_contact_details:
          type: boolean
          description: UI label 'Incluir detalhes do contato que acionou o evento'.
      required:
      - url
    after_step_id:
      type: integer
      description: Optional. Step to attach the block after; by default the block goes at the end of the flow.
outputs:
  type: object
  properties:
    step_id:
      type: integer
      description: 'Shown as ''ID da etapa #N'' in the panel. IDs are allocated at drop time and are not reused
        after an undo.'
side_effects:
- 'Expected (from the label, not seen): changes the draft only. Nothing runs while the automation is inactive (Desativada).'
- 'Expected (not seen; no automation was ever activated): once the automation is activated, sends contact data to
  the URL every time a contact reaches the step.'
postcondition_check: The canvas card shows the saved choice instead of the orange 'Defina e salve essa ação.', and
  the header reads 'Salva hoje às HH:MM'.
errors:
- condition: Step left unsaved or incomplete
  symptom: Card shows 'Defina e salve essa ação.' in orange.
  recovery: Open the card, fill the required fields and press Salvar, or remove the card with the undo arrow or
    the card menu.
limits: []
depends_on:
- automations.create_automation
execution:
  preferred: ui
  ui:
    entry: /automation/edit/<automation_id>
    steps:
    - Open /automation/edit/<automation_id>.
    - In the palette choose the tab 'Ações' (or type part of the name in 'Buscar por nome da etapa').
    - Drag the block 'Chamar um webhook' onto the dashed zone 'Solte o bloco aqui' between two steps, or on a connector.
    - Wait about 3 seconds after any undo before dragging again, otherwise the editor can stay stuck in the drag
      state until the page is reloaded.
    - 'In the side panel fill: ''URL''*; ''Método de autenticação''; ''Adicionar objeto''; ''Incluir detalhes do
      contato que acionou o evento''.'
    - Press 'Salvar' in the panel. 'Cancelar' leaves an unsaved card marked 'Defina e salve essa ação.'.
provenance:
  sources:
  - ui
  verification: observed_not_executed
  verified_at: '2026-10-22'
  evidence: evidence/automations.build_steps.json
  notes: The block was dropped and its settings panel was read, then cancelled. The save was not exercised.
description: Adding this step only changes the draft. What it does to contacts starts when the automation is activated
  (automations.activate_automation), and activation always needs an explicit human yes.
