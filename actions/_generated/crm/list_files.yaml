id: crm.list_files
domain: crm
summary: Get all files.
risk: read
reversible: true
requires_human_confirmation: false
plan_availability:
  free: unknown
  note: Plan availability of this API call was not checked.
preconditions:
- An API key (header api-key) that can access this account.
inputs:
  type: object
  properties:
    entity:
      type: string
      enum:
      - companies
      - deals
      - contacts
      description: Filter by file entity type
    entityIds:
      type: string
      description: Filter by file entity IDs
    dateFrom:
      type: integer
      description: dateFrom to date range filter type (timestamp in milliseconds)
    dateTo:
      type: integer
      description: dateTo to date range filter type (timestamp in milliseconds)
    offset:
      type: integer
      format: int64
      description: Index of the first document of the page
    limit:
      type: integer
      format: int64
      default: 50
      description: Number of documents per page
    sort:
      type: string
      enum:
      - asc
      - desc
      description: Sort the results in the ascending/descending order. Default order is **descending** by creation
        if `sort` is not passed
outputs:
  type: array
  description: List of files
  items:
    type: object
    properties:
      name:
        type: string
        description: Name of uploaded file
      authorId:
        type: string
        description: Account id of user which created the file
      contactId:
        type: integer
        format: int64
        description: Contact id of contact on which file is uploaded
      dealId:
        type: string
        description: Deal id linked to a file
      companyId:
        type: string
        description: Company id linked to a file
      size:
        type: integer
        format: int64
        description: Size of file in bytes
      createdAt:
        type: string
        format: date-time
        description: File created date/time
    description: File data that is uploaded
side_effects:
- 'Expected (from the API docs, not verified): none; read only.'
postcondition_check: HTTP 200 with the requested data.
errors:
- condition: 'HTTP 400: Returned when query params are invalid'
  recovery: Fix the request (the response body carries a machine-readable code and message), then retry.
limits: []
depends_on: []
execution:
  preferred: api
  api:
    method: GET
    path: /crm/files
    auth: api-key header (never store the value).
provenance:
  sources:
  - api_docs
  verification: documented_only
  verified_at: '2026-10-22'
  notes: 'Generated from the Brevo public API spec (SDK snapshot, Feb 2025). Not executed: the account had no API
    key. Also present in the live developer-site spec read on 2026-10-22.'
