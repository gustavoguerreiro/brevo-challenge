id: crm.list_deals
domain: crm
summary: Get all deals.
risk: read
reversible: true
requires_human_confirmation: false
plan_availability:
  free: unknown
  note: Plan availability of this API call was not checked.
preconditions:
- An API key (header api-key) that can access this account.
inputs:
  type: object
  properties:
    filters[attributes.deal_name]:
      type: string
      description: Filter by attributes. If you have a filter for the owner on your end, please send it as filters[attributes.deal_owner]
        and utilize the account email for the filtering.
    filters[linkedCompaniesIds]:
      type: string
      description: Filter by linked companies ids
    filters[linkedContactsIds]:
      type: string
      description: Filter by linked companies ids
    offset:
      type: integer
      format: int64
      description: Index of the first document of the page
    limit:
      type: integer
      format: int64
      default: 50
      description: Number of documents per page
    sort:
      type: string
      enum:
      - asc
      - desc
      description: Sort the results in the ascending/descending order. Default order is **descending** by creation
        if `sort` is not passed
    sortBy:
      type: string
      description: The field used to sort field names.
outputs:
  type: object
  properties:
    items:
      type: array
      description: List of deals
      items:
        type: object
        properties:
          id:
            type: string
            description: Unique deal id
          attributes:
            type: object
            description: Deal attributes with values
            properties: {}
          linkedContactsIds:
            type: array
            description: Contact ids for contacts linked to this deal
            items:
              type: integer
          linkedCompaniesIds:
            type: array
            description: Companies ids for companies linked to this deal
            items:
              type: string
        description: Deal Details
  description: List of Deals
side_effects:
- 'Expected (from the API docs, not verified): none; read only.'
postcondition_check: HTTP 200 with the requested data.
errors:
- condition: 'HTTP 400: Returned when query params are invalid'
  recovery: Fix the request (the response body carries a machine-readable code and message), then retry.
limits: []
depends_on: []
execution:
  preferred: api
  api:
    method: GET
    path: /crm/deals
    auth: api-key header (never store the value).
provenance:
  sources:
  - api_docs
  verification: documented_only
  verified_at: '2026-10-22'
  notes: 'Generated from the Brevo public API spec (SDK snapshot, Feb 2025). Not executed: the account had no API
    key. Also present in the live developer-site spec read on 2026-10-22.'
