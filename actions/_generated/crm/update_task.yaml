id: crm.update_task
domain: crm
summary: Change the fields or the done state of a CRM task.
risk: write
reversible: true
requires_human_confirmation: false
plan_availability:
  free: unknown
  note: Plan availability of this API call was not checked.
preconditions:
- An API key (header api-key) that can access this account.
- Path value 'id' must identify an existing record.
inputs:
  type: object
  properties:
    id:
      type: string
    name:
      type: string
      description: Name of task
      x-in: body
    duration:
      type: integer
      description: Duration of task in milliseconds [1 minute = 60000 ms]
      x-in: body
    taskTypeId:
      type: string
      description: Id for type of task e.g Call / Email / Meeting etc.
      x-in: body
    date:
      type: string
      format: date-time
      description: Task date/time
      x-in: body
    notes:
      type: string
      description: Notes added to a task
      x-in: body
    done:
      type: boolean
      description: Task marked as done
      x-in: body
    assignToId:
      type: string
      description: To assign a task to a user you can use either the account email or ID.
      x-in: body
    contactsIds:
      type: array
      description: Contact ids for contacts linked to this task
      items:
        type: integer
      x-in: body
    dealsIds:
      type: array
      description: Deal ids for deals a task is linked to
      items:
        type: string
      x-in: body
    companiesIds:
      type: array
      description: Companies ids for companies a task is linked to
      items:
        type: string
      x-in: body
  required:
  - id
side_effects:
- 'Expected (from the API docs, not verified): Setting a task done can fire ''Tarefa concluída'' automations.'
postcondition_check: HTTP 204 (or 200); read the item back with its get_/list_ action and compare the fields you
  changed.
errors:
- condition: 'HTTP 400: Returned when invalid data posted'
  recovery: Fix the request (the response body carries a machine-readable code and message), then retry.
- condition: 'HTTP 404: Returned when task id is not found'
  recovery: The referenced id does not exist; list the parent collection to find a valid id.
limits: []
depends_on: []
execution:
  preferred: api
  api:
    method: PATCH
    path: /crm/tasks/{id}
    auth: api-key header (never store the value).
provenance:
  sources:
  - api_docs
  verification: documented_only
  verified_at: '2026-10-22'
  notes: 'Generated from the Brevo public API spec (SDK snapshot, Feb 2025). Not executed: the account had no API
    key. Also present in the live developer-site spec read on 2026-10-22.'
description: 'Author''s note (from the docs or from reading the spec; not verified): Setting a task done can fire
  ''Tarefa concluída'' automations.'
