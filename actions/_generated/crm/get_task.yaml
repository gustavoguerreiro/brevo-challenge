id: crm.get_task
domain: crm
summary: Get a task.
risk: read
reversible: true
requires_human_confirmation: false
plan_availability:
  free: unknown
  note: Plan availability of this API call was not checked.
preconditions:
- An API key (header api-key) that can access this account.
- Path value 'id' must identify an existing record.
inputs:
  type: object
  properties:
    id:
      type: string
  required:
  - id
outputs:
  type: object
  required:
  - name
  - taskTypeId
  properties:
    id:
      type: string
      description: Unique task id
    taskTypeId:
      type: string
      description: Id for type of task e.g Call / Email / Meeting etc.
    name:
      type: string
      description: Name of task
    contactsIds:
      type: array
      description: Contact ids for contacts linked to this task
      items:
        type: integer
    dealsIds:
      type: array
      description: Deal ids for deals a task is linked to
      items:
        type: string
    companiesIds:
      type: array
      description: Companies ids for companies a task is linked to
      items:
        type: string
  description: Task Details
side_effects:
- 'Expected (from the API docs, not verified): none; read only.'
postcondition_check: HTTP 200 with the requested data.
errors:
- condition: 'HTTP 400: Returned when task id is invalid'
  recovery: Fix the request (the response body carries a machine-readable code and message), then retry.
- condition: 'HTTP 404: Returned when item not found'
  recovery: The referenced id does not exist; list the parent collection to find a valid id.
limits: []
depends_on: []
execution:
  preferred: api
  api:
    method: GET
    path: /crm/tasks/{id}
    auth: api-key header (never store the value).
provenance:
  sources:
  - api_docs
  verification: documented_only
