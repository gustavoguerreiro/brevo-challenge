id: crm.update_deal_links
domain: crm
summary: Link and Unlink a deal with contacts and companies.
risk: write
reversible: true
requires_human_confirmation: false
plan_availability:
  free: unknown
  note: Plan availability of this API call was not checked.
preconditions:
- An API key (header api-key) that can access this account.
- Path value 'id' must identify an existing record.
inputs:
  type: object
  properties:
    id:
      type: string
    linkContactIds:
      type: array
      description: Contact ids for contacts to be linked with deal
      items:
        type: integer
        format: int64
      x-in: body
    unlinkContactIds:
      type: array
      description: Contact ids for contacts to be unlinked from deal
      items:
        type: integer
        format: int64
