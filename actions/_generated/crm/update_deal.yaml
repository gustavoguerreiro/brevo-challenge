id: crm.update_deal
domain: crm
summary: Change the attributes or pipeline stage of a CRM deal.
risk: write
reversible: true
requires_human_confirmation: false
plan_availability:
  free: unknown
  note: Plan availability of this API call was not checked.
preconditions:
- An API key (header api-key) that can access this account.
- Path value 'id' must identify an existing record.
inputs:
  type: object
  properties:
    id:
      type: string
    name:
      type: string
      description: Name of deal
      x-in: body
    attributes:
      type: object
      description: Attributes for deal update To assign owner of a Deal you can send attributes.deal_owner and utilize
        the account email or ID. If you wish to update the pipeline of a deal you need to provide the `pipeline`
        and the `deal_stage`. Pipeline and …
      properties: {}
      x-in: body
  required:
  - id
side_effects:
- 'Expected (from the API docs, not verified): changes account data.'
postcondition_check: HTTP 204 (or 200); read the item back with its get_/list_ action and compare the fields you
  changed.
errors:
- condition: 'HTTP 400: Returned when invalid data posted'
  recovery: Fix the request (the response body carries a machine-readable code and message), then retry.
- condition: 'HTTP 404: Returned when deal id is not found'
  recovery: The referenced id does not exist; list the parent collection to find a valid id.
limits: []
depends_on: []
execution:
  preferred: api
  api:
    method: PATCH
    path: /crm/deals/{id}
    auth: api-key header (never store the value).
provenance:
  sources:
  - api_docs
  verification: documented_only
  verified_at: '2026-10-22'
  notes: 'Generated from the Brevo public API spec (SDK snapshot, Feb 2025). Not executed: the account had no API
