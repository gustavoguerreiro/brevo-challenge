id: crm.list_tasks
domain: crm
summary: Get all tasks.
risk: read
reversible: true
requires_human_confirmation: false
plan_availability:
  free: unknown
  note: Plan availability of this API call was not checked.
preconditions:
- An API key (header api-key) that can access this account.
inputs:
  type: object
  properties:
    filter[type]:
      type: string
      description: Filter by task type (ID)
    filter[status]:
      type: string
      enum:
      - done
      - undone
      description: Filter by task status
    filter[date]:
      type: string
      enum:
      - overdue
      - today
      - tomorrow
      - week
      - range
      description: Filter by date
    filter[assignTo]:
      type: string
      description: Filter by the "assignTo" ID. You can utilize account emails for the "assignTo" attribute.
    filter[contacts]:
      type: string
      description: Filter by contact ids
    filter[deals]:
      type: string
      description: Filter by deals ids
    filter[companies]:
      type: string
      description: Filter by companies ids
    dateFrom:
      type: integer
      description: dateFrom to date range filter type (timestamp in milliseconds)
    dateTo:
      type: integer
      description: dateTo to date range filter type (timestamp in milliseconds)
    offset:
      type: integer
      format: int64
      description: Index of the first document of the page
    limit:
      type: integer
      format: int64
      default: 50
      description: Number of documents per page
    sort:
      type: string
      enum:
      - asc
      - desc
      description: Sort the results in the ascending/descending order. Default order is **descending** by creation
        if `sort` is not passed
    sortBy:
      type: string
      description: The field used to sort field names.
outputs:
  type: object
  properties:
    items:
      type: array
      description: List of tasks
      items:
        type: object
        required:
        - name
        - taskTypeId
        properties:
          id:
            type: string
            description: Unique task id
          taskTypeId:
            type: string
            description: Id for type of task e.g Call / Email / Meeting etc.
          name:
            type: string
            description: Name of task
          contactsIds:
            type: array
            description: Contact ids for contacts linked to this task
            items:
              type: integer
          dealsIds:
            type: array
            description: Deal ids for deals a task is linked to
            items:
              type: string
          companiesIds:
            type: array
            description: Companies ids for companies a task is linked to
            items:
              type: string
        description: Task Details
  description: List of tasks
side_effects:
- 'Expected (from the API docs, not verified): none; read only.'
postcondition_check: HTTP 200 with the requested data.
errors:
- condition: 'HTTP 400: Returned when query params are invalid'
  recovery: Fix the request (the response body carries a machine-readable code and message), then retry.
limits: []
depends_on: []
execution:
  preferred: api
  api:
    method: GET
    path: /crm/tasks
    auth: api-key header (never store the value).
provenance:
  sources:
  - api_docs
  verification: documented_only
  verified_at: '2026-10-22'
  notes: 'Generated from the Brevo public API spec (SDK snapshot, Feb 2025). Not executed: the account had no API
    key. Also present in the live developer-site spec read on 2026-10-22.'
