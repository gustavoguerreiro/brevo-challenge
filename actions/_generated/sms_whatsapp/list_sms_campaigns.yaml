id: sms_whatsapp.list_sms_campaigns
domain: sms_whatsapp
summary: Returns the information for all your created SMS campaigns.
risk: read
reversible: true
requires_human_confirmation: false
plan_availability:
  free: unknown
  note: Plan availability of this API call was not checked.
preconditions:
- An API key (header api-key) that can access this account.
inputs:
  type: object
  properties:
    status:
      type: string
      enum:
      - suspended
      - archive
      - sent
      - queued
      - draft
      - inProcess
      description: Status of campaign.
    startDate:
      type: string
      description: Mandatory if endDate is used. Starting (urlencoded) UTC date-time (YYYY-MM-DDTHH:mm:ss.SSSZ)
        to filter the sent sms campaigns. Prefer to pass your timezone in date-time format for accurate result (
        only available if either 'status' not …
    endDate:
      type: string
      description: Mandatory if startDate is used. Ending (urlencoded) UTC date-time (YYYY-MM-DDTHH:mm:ss.SSSZ)
        to filter the sent sms campaigns. Prefer to pass your timezone in date-time format for accurate result (
        only available if either 'status' not …
    limit:
      type: integer
      format: int64
      default: 500
      description: Number limitation for the result returned
    offset:
      type: integer
      format: int64
      default: 0
      description: Beginning point in the list to retrieve from.
    sort:
      type: string
      enum:
      - asc
      - desc
      default: desc
      description: Sort the results in the ascending/descending order of record creation. Default order is **descending**
        if `sort` is not passed
outputs:
  type: object
  properties:
    campaigns:
      type: array
      items:
        type: object
        allOf:
        - type: object
          required:
          - content
          - createdAt
          - id
          - modifiedAt
          - name
          - sender
          - status
          properties:
            id:
              type: integer
              format: int64
              description: ID of the SMS Campaign
            name:
              type: string
              description: Name of the SMS Campaign
            status:
              type: string
              description: Status of the SMS Campaign
              enum:
              - draft
              - sent
              - archive
              - queued
              - suspended
              - inProcess
            content:
              type: string
              description: Content of the SMS Campaign
            scheduledAt:
              type: string
              description: UTC date-time on which SMS campaign is scheduled. Should be in YYYY-MM-DDTHH:mm:ss.SSSZ
                format
            sender:
              type: string
              description: Sender of the SMS Campaign
            createdAt:
              type: string
              description: Creation UTC date-time of the SMS campaign (YYYY-MM-DDTHH:mm:ss.SSSZ)
            modifiedAt:
              type: string
              description: UTC date-time of last modification of the SMS campaign (YYYY-MM-DDTHH:mm:ss.SSSZ)
        - type: object
          properties:
            recipients:
              type: object
              allOf:
              - type: object
                required:
                - exclusionLists
                - lists
                properties:
                  lists:
                    type: array
                    items:
                      type: integer
                      format: int64
                      description: List IDs included in the campaign
                  exclusionLists:
                    type: array
                    items:
                      type: integer
                      format: int64
                      description: List IDs excluded of the campaign
            statistics:
              type: object
              allOf:
              - type: object
                required:
                - answered
                - delivered
                - hardBounces
                - processing
                - sent
                - softBounces
                - unsubscriptions
                properties:
                  delivered:
                    type: integer
                    format: int64
                    description: Number of delivered SMS
                  sent:
                    type: integer
                    format: int64
                    description: Number of sent SMS
                  processing:
                    type: integer
                    format: int64
                    description: Number of processing SMS
                  softBounces:
                    type: integer
                    format: int64
                    description: Number of softbounced SMS
                  hardBounces:
                    type: integer
                    format: int64
                    description: Number of hardbounced SMS
                  unsubscriptions:
                    type: integer
                    format: int64
                    description: Number of unsubscription SMS
                  answered:
                    type: integer
                    format: int64
                    description: Number of replies to the SMS
          required:
          - recipients
          - statistics
    count:
      type: integer
      format: int64
      description: Number of SMS campaigns retrieved
side_effects:
- 'Expected (from the API docs, not verified): none; read only.'
postcondition_check: HTTP 200 with the requested data.
errors:
- condition: 'HTTP 400: bad request'
  recovery: Fix the request (the response body carries a machine-readable code and message), then retry.
limits: []
depends_on: []
execution:
  preferred: api
  api:
    method: GET
    path: /smsCampaigns
    auth: api-key header (never store the value).
    operation_id: getSmsCampaigns
provenance:
  sources:
  - api_docs
  verification: documented_only
  verified_at: '2026-10-22'
  notes: 'Generated from the Brevo public API spec (SDK snapshot, Feb 2025). Not executed: the account had no API
    key. Also present in the live developer-site spec read on 2026-10-22.'
