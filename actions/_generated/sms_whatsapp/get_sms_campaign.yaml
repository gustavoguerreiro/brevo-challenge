id: sms_whatsapp.get_sms_campaign
domain: sms_whatsapp
summary: Get an SMS campaign.
risk: read
reversible: true
requires_human_confirmation: false
plan_availability:
  free: unknown
  note: Plan availability of this API call was not checked.
preconditions:
- An API key (header api-key) that can access this account.
- Path value 'campaignId' must identify an existing record.
inputs:
  type: object
  properties:
    campaignId:
      type: integer
      format: int64
      description: id of the SMS campaign
  required:
  - campaignId
outputs:
  allOf:
  - type: object
    required:
    - content
    - createdAt
    - id
    - modifiedAt
    - name
    - sender
    - status
    properties:
      id:
        type: integer
        format: int64
        description: ID of the SMS Campaign
      name:
        type: string
        description: Name of the SMS Campaign
      status:
        type: string
        description: Status of the SMS Campaign
        enum:
        - draft
        - sent
        - archive
        - queued
        - suspended
        - inProcess
      content:
        type: string
        description: Content of the SMS Campaign
      scheduledAt:
        type: string
        description: UTC date-time on which SMS campaign is scheduled. Should be in YYYY-MM-DDTHH:mm:ss.SSSZ format
      sender:
        type: string
        description: Sender of the SMS Campaign
      createdAt:
        type: string
        description: Creation UTC date-time of the SMS campaign (YYYY-MM-DDTHH:mm:ss.SSSZ)
      modifiedAt:
        type: string
        description: UTC date-time of last modification of the SMS campaign (YYYY-MM-DDTHH:mm:ss.SSSZ)
  - type: object
    required:
    - recipients
    - statistics
    properties:
      recipients:
        type: object
        allOf:
        - type: object
          required:
          - exclusionLists
          - lists
          properties:
            lists:
              type: array
              items:
                type: integer
                format: int64
                description: List IDs included in the campaign
            exclusionLists:
              type: array
              items:
                type: integer
                format: int64
                description: List IDs excluded of the campaign
      statistics:
        type: object
        allOf:
        - type: object
          required:
          - answered
          - delivered
          - hardBounces
          - processing
          - sent
          - softBounces
          - unsubscriptions
          properties:
            delivered:
              type: integer
              format: int64
              description: Number of delivered SMS
            sent:
              type: integer
              format: int64
              description: Number of sent SMS
            processing:
              type: integer
              format: int64
              description: Number of processing SMS
            softBounces:
              type: integer
              format: int64
              description: Number of softbounced SMS
            hardBounces:
              type: integer
              format: int64
              description: Number of hardbounced SMS
            unsubscriptions:
              type: integer
              format: int64
              description: Number of unsubscription SMS
            answered:
              type: integer
              format: int64
              description: Number of replies to the SMS
side_effects:
- 'Expected (from the API docs, not verified): none; read only.'
postcondition_check: HTTP 200 with the requested data.
errors:
- condition: 'HTTP 400: bad request'
  recovery: Fix the request (the response body carries a machine-readable code and message), then retry.
- condition: 'HTTP 404: Campaign ID not found'
  recovery: The referenced id does not exist; list the parent collection to find a valid id.
limits: []
depends_on: []
execution:
  preferred: api
  api:
    method: GET
    path: /smsCampaigns/{campaignId}
    auth: api-key header (never store the value).
    operation_id: getSmsCampaign
provenance:
  sources:
  - api_docs
  verification: documented_only
  verified_at: '2026-10-22'
  notes: 'Generated from the Brevo public API spec (SDK snapshot, Feb 2025). Not executed: the account had no API
    key. Also present in the live developer-site spec read on 2026-10-22.'
