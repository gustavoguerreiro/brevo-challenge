id: sms_whatsapp.get_whatsapp_config
domain: sms_whatsapp
summary: Get your WhatsApp API account information.
risk: read
reversible: true
requires_human_confirmation: false
plan_availability:
  free: unknown
  note: Plan availability of this API call was not checked.
preconditions:
- An API key (header api-key) that can access this account.
inputs:
  type: object
  properties: {}
outputs:
  type: object
  properties:
    whatsappBusinessAccountId:
      type: string
      description: Id of the WhatsApp business account
    sendingLimit:
      type: string
      description: Sending limit Information of the WhatsApp API account
    phoneNumberQuality:
      type: string
      description: Quality status of phone number associated with WhatsApp account. There are three quality ratings.
        example - **High (GREEN) , Medium (YELLOW) and Low(RED)**
      enum:
      - GREEN
      - YELLOW
      - RED
    whatsappBusinessAccountStatus:
      type: string
      description: Status information related to WhatsApp Api account
    businessStatus:
      type: string
      description: Verification status information of the Business account
    phoneNumberNameStatus:
      type: string
      description: Status of the name associated with WhatsApp Phone number
      enum:
      - APPROVED
      - PENDING
      - REJECTED
