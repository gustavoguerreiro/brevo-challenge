id: sms_whatsapp.list_whatsapp_templates
domain: sms_whatsapp
summary: Return all your created WhatsApp templates.
risk: read
reversible: true
requires_human_confirmation: false
plan_availability:
  free: unknown
  note: Plan availability of this API call was not checked.
preconditions:
- An API key (header api-key) that can access this account.
inputs:
  type: object
  properties:
    startDate:
      type: string
      description: '**Mandatory if endDate is used**. Starting (urlencoded) UTC date-time (YYYY-MM-DDTHH:mm:ss.SSSZ)
        to filter the templates created. **Prefer to pass your timezone in date-time format for accurate result**'
    endDate:
      type: string
      description: '**Mandatory if startDate is used**. Ending (urlencoded) UTC date-time (YYYY-MM-DDTHH:mm:ss.SSSZ)
        to filter the templates created. **Prefer to pass your timezone in date-time format for accurate result**'
    limit:
      type: integer
      format: int64
      default: 50
      description: Number of documents per page
    offset:
      type: integer
      format: int64
      default: 0
      description: Index of the first document in the page
    sort:
      type: string
      enum:
      - asc
      - desc
      default: desc
      description: Sort the results in the ascending/descending order of record modification. Default order is **descending**
        if `sort` is not passed
    source:
      type: string
      enum:
      - Automation
      - Conversations
      description: source of the template
outputs:
  type: object
  required:
  - count
  - templates
  properties:
    templates:
      type: array
      items:
        type: object
        required:
        - category
        - createdAt
        - id
        - language
        - modifiedAt
        - name
        - status
        properties:
          id:
            type: string
            description: id of the template
          name:
            type: string
            description: Name of the WhatsApp template
          status:
            type: string
            description: Status of the WhatsApp template
          language:
            type: string
            description: Language in which template exists
          category:
            type: string
            description: category of the template
          errorReason:
            type: string
            description: Error reason in the template creation
          createdAt:
            type: string
            description: Creation UTC date-time of the whatsApp template (YYYY-MM-DDTHH:mm:ss.SSSZ)
          modifiedAt:
            type: string
            description: UTC date-time of last modification of the whatsApp template (YYYY-MM-DDTHH:mm:ss.SSSZ)
    count:
      type: integer
      format: int64
      description: Number of whatsApp templates retrived
side_effects:
- 'Expected (from the API docs, not verified): none; read only.'
postcondition_check: HTTP 200 with the requested data.
errors:
- condition: 'HTTP 400: bad request'
  recovery: Fix the request (the response body carries a machine-readable code and message), then retry.
limits: []
depends_on: []
execution:
  preferred: api
  api:
    method: GET
    path: /whatsappCampaigns/template-list
    auth: api-key header (never store the value).
    operation_id: getWhatsAppTemplates
provenance:
  sources:
  - api_docs
  verification: documented_only
  verified_at: '2026-10-22'
  notes: 'Generated from the Brevo public API spec (SDK snapshot, Feb 2025). Not executed: the account had no API
    key. Also present in the live developer-site spec read on 2026-10-22.'
