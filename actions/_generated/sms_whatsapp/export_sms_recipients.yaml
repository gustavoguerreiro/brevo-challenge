id: sms_whatsapp.export_sms_recipients
domain: sms_whatsapp
summary: Export an SMS campaign's recipients.
risk: write
reversible: true
requires_human_confirmation: false
plan_availability:
  free: unknown
  note: Plan availability of this API call was not checked.
preconditions:
- An API key (header api-key) that can access this account.
- Path value 'campaignId' must identify an existing record.
inputs:
  type: object
  properties:
    campaignId:
      type: integer
      format: int64
      description: id of the campaign
    notifyURL:
      type: string
      format: url
      description: URL that will be called once the export process is finished. For reference, https://help.brevo.com/hc/en-us/articles/360007666479
      x-in: body
    recipientsType:
      type: string
      description: Filter the recipients based on how they interacted with the campaign
      enum:
      - all
      - delivered
      - answered
      - softBounces
      - hardBounces
      - unsubscribed
      x-in: body
  required:
  - campaignId
  - recipientsType
outputs:
  type: object
  required:
  - processId
  properties:
    processId:
      type: integer
      format: int64
      description: Id of the process created
side_effects:
- 'Expected (from the API docs, not verified): changes account data.'
postcondition_check: HTTP 2xx; read the affected item back to confirm.
errors:
- condition: 'HTTP 400: bad request'
  recovery: Fix the request (the response body carries a machine-readable code and message), then retry.
- condition: 'HTTP 404: Campaign ID not found'
  recovery: The referenced id does not exist; list the parent collection to find a valid id.
limits: []
depends_on: []
execution:
  preferred: api
  api:
    method: POST
    path: /smsCampaigns/{campaignId}/exportRecipients
    auth: api-key header (never store the value).
    operation_id: requestSmsRecipientExport
provenance:
  sources:
  - api_docs
  verification: documented_only
  verified_at: '2026-10-22'
  notes: 'Generated from the Brevo public API spec (SDK snapshot, Feb 2025). Not executed: the account had no API
    key. Also present in the live developer-site spec read on 2026-10-22.'
