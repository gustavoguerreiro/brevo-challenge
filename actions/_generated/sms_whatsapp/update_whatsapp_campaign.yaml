id: sms_whatsapp.update_whatsapp_campaign
domain: sms_whatsapp
summary: Update a WhatsApp campaign.
risk: external_effect
reversible: false
requires_human_confirmation: true
plan_availability:
  free: unknown
  note: Plan availability of this API call was not checked.
preconditions:
- An API key (header api-key) that can access this account.
- Path value 'campaignId' must identify an existing record.
inputs:
  type: object
  properties:
    campaignId:
      type: integer
      format: int64
      description: Id of the campaign
    campaignName:
      type: string
      description: Name of the campaign
      x-in: body
    campaignStatus:
      type: string
      description: Status of the campaign
      enum:
      - scheduled
      - suspended
      default: scheduled
      x-in: body
    rescheduleFor:
      type: string
      description: 'Reschedule the sending UTC date-time (YYYY-MM-DDTHH:mm:ss.SSSZ) of campaign. **Prefer to pass
        your timezone in date-time format for accurate result.For example: **2017-06-01T12:30:00+02:00** Use this
        field to update the scheduledAt of any …'
      x-in: body
    recipients:
      type: object
      properties:
        excludedListIds:
          type: array
          description: List ids to exclude from the campaign
          items:
            type: integer
            format: int64
        listIds:
          type: array
          description: '**Mandatory if scheduledAt is not empty**. List Ids to send the campaign to'
          items:
            type: integer
            format: int64
        segments:
          type: array
          description: '**Mandatory if listIds are not used**. Segment ids to send the campaign to.'
          items:
            type: integer
            format: int64
      description: Segment ids and List ids to include/exclude from campaign
      x-in: body
  required:
  - campaignId
side_effects:
- 'Expected (from the API docs, not verified): reaches real recipients or third parties and cannot be recalled.'
postcondition_check: HTTP 204 (or 200); read the item back with its get_/list_ action and compare the fields you
  changed.
errors:
- condition: 'HTTP 400: bad request'
  recovery: Fix the request (the response body carries a machine-readable code and message), then retry.
- condition: 'HTTP 404: Campaign id not found'
  recovery: The referenced id does not exist; list the parent collection to find a valid id.
limits: []
depends_on: []
execution:
  preferred: api
  api:
    method: PUT
    path: /whatsappCampaigns/{campaignId}
    auth: api-key header (never store the value).
    operation_id: updateWhatsAppCampaign
provenance:
  sources:
  - api_docs
  verification: documented_only
  verified_at: '2026-10-22'
  notes: 'Generated from the Brevo public API spec (SDK snapshot, Feb 2025). Not executed: the account had no API
    key. Also present in the live developer-site spec read on 2026-10-22.'
description: 'Author''s note (from the docs or from reading the spec; not verified): Marked external_effect because
  the body carries rescheduleFor (changes when real messages go out).'
