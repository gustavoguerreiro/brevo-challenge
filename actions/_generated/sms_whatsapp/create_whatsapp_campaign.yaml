id: sms_whatsapp.create_whatsapp_campaign
domain: sms_whatsapp
summary: Create and Send a WhatsApp campaign.
risk: external_effect
reversible: false
requires_human_confirmation: true
plan_availability:
  free: blocked
  note: The 'WhatsApp' card of 'Criar campanha' carries a crown and opens an upgrade panel on Free (observed live).
    The API call was not tried; it is expected to fail without a WhatsApp Business account and a plan that includes
    it.
preconditions:
- An API key (header api-key) that can access this account.
inputs:
  type: object
  properties:
    name:
      type: string
      description: Name of the WhatsApp campaign creation
      x-in: body
    templateId:
      type: integer
      description: Id of the WhatsApp template in **approved** state
      x-in: body
    scheduledAt:
      type: string
      description: 'Sending UTC date-time (YYYY-MM-DDTHH:mm:ss.SSSZ). **Prefer to pass your timezone in date-time
        format for accurate result.For example: **2017-06-01T12:30:00+02:00**'
      x-in: body
    recipients:
      type: object
      properties:
        excludedListIds:
          type: array
          description: List ids to exclude from the campaign
          items:
            type: integer
            format: int64
        listIds:
          type: array
          description: '**Mandatory if scheduledAt is not empty**. List Ids to send the campaign to'
          items:
            type: integer
            format: int64
        segments:
          type: array
          description: '**Mandatory if listIds are not used**. Segment ids to send the campaign to.'
          items:
            type: integer
            format: int64
      description: Segment ids and List ids to include/exclude from campaign
      x-in: body
  required:
  - name
  - recipients
  - scheduledAt
  - templateId
outputs:
  type: object
  required:
  - id
  properties:
    id:
      type: integer
      format: int64
      description: ID of the object created
side_effects:
- 'Expected (from the API docs, not verified): reaches real recipients or third parties and cannot be recalled.'
postcondition_check: HTTP 201 (or 200) returning the new id; read the item back with its get_/list_ action to confirm.
errors:
- condition: 'HTTP 400: bad request'
  recovery: Fix the request (the response body carries a machine-readable code and message), then retry.
limits: []
depends_on: []
execution:
  preferred: api
  api:
    method: POST
    path: /whatsappCampaigns
    auth: api-key header (never store the value).
    operation_id: createWhatsAppCampaign
  ui:
    entry: /campaigns/listing
    steps:
    - On Marketing > Campanhas press 'Criar campanha' and pick the card 'WhatsApp' (crown).
    - 'On Free a panel titled ''Vá aonde seu cliente está com o WhatsApp'' opens with the button ''Atualizar''.
      Stop here: the campaign editor was never seen.'
provenance:
  sources:
  - api_docs
  - ui
  verification: observed_not_executed
  verified_at: '2026-10-22'
  notes: 'UI route: only the upgrade panel was seen. The API summary says ''Create and Send'', so the API call is
    treated as an external effect. Generated from the Brevo public API spec (SDK snapshot, Feb 2025). Not executed:
    the account had no API key. Also present in the live developer-site spec read on 2026-10-22.'
  evidence: evidence/ui.plan_gating.json
description: 'Author''s note (from the docs or from reading the spec; not verified): The API summary says ''Create
  and Send'': the body carries scheduledAt and the call can send to real recipients.'
ui_label_pt: Criar campanha > WhatsApp
