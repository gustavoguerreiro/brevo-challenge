id: contacts.list_segments
domain: contacts
summary: List the saved segments. The API reads segments but cannot create them.
risk: read
reversible: true
requires_human_confirmation: false
plan_availability:
  free: available
preconditions:
- An API key (header api-key) that can access this account.
inputs:
  type: object
  properties:
    limit:
      type: integer
      format: int64
      default: 10
      description: Number of documents per page
    offset:
      type: integer
      format: int64
      default: 0
      description: Index of the first document of the page
    sort:
      type: string
      enum:
      - asc
      - desc
      default: desc
      description: Sort the results in the ascending/descending order of record creation. Default order is **descending**
        if `sort` is not passed
  required:
  - limit
  - offset
outputs:
  type: object
  properties:
    segments:
      type: object
      properties:
        id:
          type: integer
          format: int64
          description: ID of the list
        segmentName:
          type: string
          description: Name of the Segment
        categoryName:
          type: string
          format: string
          description: Name of the Segment Category
        updatedAt:
          type: string
          description: Updation UTC date-time of the segment (YYYY-MM-DDTHH:mm:ss.SSSZ)
    count:
      type: integer
      format: int64
      description: Number of Segments available in your account
side_effects:
- 'Expected (from the API docs, not verified): none; read only.'
postcondition_check: HTTP 200 with the requested data.
errors:
- condition: 'HTTP 400: bad request'
  recovery: Fix the request (the response body carries a machine-readable code and message), then retry.
limits: []
depends_on: []
execution:
  preferred: api
  api:
    method: GET
    path: /contacts/segments
    auth: api-key header (never store the value).
    operation_id: getSegments
  ui:
    entry: /contact/segment
    steps:
    - Open CRM > Contatos > Segmentos.
    - 'Columns: Segmento, ID, Pasta, Contatos, Última edição, Ações. Search box ''Pesquise um nome ou ID de segmento''.
      Folder dropdown ''Todas as pastas (N segmentos)''.'
    internal_service: segments-api/segment/listing and segment/folder/listing
provenance:
  sources:
  - api_docs
  - ui
  - network
  verification: executed_verified
  verified_at: '2026-10-22'
  notes: 'Read in the UI many times. Generated from the Brevo public API spec (SDK snapshot, Feb 2025). Not executed:
    the account had no API key. Also present in the live developer-site spec read on 2026-10-22.'
  verified_via:
  - ui
  evidence: evidence/contacts.segment_row_actions.json
description: 'Author''s note (from the docs or from reading the spec; not verified): Read only; segments cannot
  be created through the API.'
ui_label_pt: Segmentos
