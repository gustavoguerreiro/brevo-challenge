id: contacts.update_list
domain: contacts
summary: Rename a contact list or move it to another folder.
risk: write
reversible: true
requires_human_confirmation: false
plan_availability:
  free: available
preconditions:
- An API key (header api-key) that can access this account.
- Path value 'listId' must identify an existing record.
- 'UI route: a list whose numeric ID equals the ID of a system folder can drag that folder''s name along when renamed
  (observed with list 3). Before renaming, list the folders and note their names; after renaming, compare. Prefer
  PUT /contacts/lists/{listId} (not tested) for such lists.'
inputs:
  type: object
  properties:
    listId:
      type: integer
      format: int64
      description: Id of the list
    name:
      type: string
      description: Name of the list. Either of the two parameters (name, folderId) can be updated at a time.
      x-in: body
    folderId:
      type: integer
      format: int64
      description: Id of the folder in which the list is to be moved. Either of the two parameters (name, folderId)
        can be updated at a time.
      x-in: body
  required:
  - listId
side_effects:
- 'Expected (from the API docs, not verified): changes account data.'
- 'Observed: renaming a list through the UI also renamed the system folder whose numeric ID equals the list ID (see
  evidence). After any rename, re-read the folder list and compare with the old folder names.'
postcondition_check: 'UI: toast ''Lista renomeada para "<name>"'' and the new name in the Listas table. Then check
  the Pasta column of the other lists for unwanted changes. API: HTTP 204, then read it back with contacts.get_list.'
errors:
- condition: 'HTTP 400: bad request'
  recovery: Fix the request (the response body carries a machine-readable code and message), then retry.
- condition: 'HTTP 404: List ID not found'
  recovery: The referenced id does not exist; list the parent collection to find a valid id.
limits: []
depends_on: []
execution:
  preferred: api
  api:
    method: PUT
    path: /contacts/lists/{listId}
    auth: api-key header (never store the value).
    operation_id: updateList
  ui:
    entry: /contact/list-listing
    steps:
    - Go to CRM > Contatos > Listas and write down the names in the Pasta column (and the folder list) before renaming.
    - 'Open the three-dot menu in the Ações column of the list row (menu: Configurações das listas, Duplicar, Importar
      contatos para a lista, Renomear, Mover, Excluir lista).'
    - 'Renomear: in the side panel ''Renomear lista'' replace ''Nome da lista'' (max 255) and press ''Renomear lista''.
      Submitting an unchanged name sends nothing.'
    - After the toast, reload and compare the folder names with the ones noted earlier. If a folder name changed,
      rename the list back to restore it (that is how it was repaired in the test).'
    - 'Mover (observed only): pick another folder in the panel. Needs at least one more folder.'
    internal_service: contacts-api-v2/lists/update (a GET request, then lists/get-folders and lists/get-lists to
      refresh)
provenance:
  sources:
  - api_docs
  - ui
  - network
  verification: executed_verified
  verified_at: '2026-10-22'
  notes: 'Rename executed in the UI twice (and a third time to repair an unexpected folder rename). Move not executed.
    Generated from the Brevo public API spec (SDK snapshot, Feb 2025). Not executed: the account had no API key.
    Also present in the live developer-site spec read on 2026-10-22.'
  verified_via:
  - ui
  evidence: evidence/contacts.update_list.json
ui_label_pt: Renomear / Mover (menu de ações da lista)
