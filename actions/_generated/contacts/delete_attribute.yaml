id: contacts.delete_attribute
domain: contacts
summary: Delete a contact attribute (destructive; confirm first).
risk: destructive
reversible: false
requires_human_confirmation: true
plan_availability:
  free: unknown
  note: Plan availability of this API call was not checked.
preconditions:
- An API key (header api-key) that can access this account.
- 'Path value ''attributeCategory'' must be one of: normal, transactional, category, calculated, global.'
- Path value 'attributeName' must identify an existing record.
inputs:
  type: object
  properties:
    attributeCategory:
      type: string
      enum:
      - normal
      - transactional
      - category
      - calculated
      - global
      description: Category of the attribute
    attributeName:
      type: string
      description: Name of the existing attribute
  required:
  - attributeCategory
  - attributeName
side_effects:
- 'Expected (from the API docs, not verified): The attribute and all stored values are removed from every contact.'
- 'Expected (from the API docs, not verified): removes data; the public API documents no undo.'
postcondition_check: HTTP 204 (or 200); then a get_ of the same id should answer 404 (expected, not tested).
errors:
- condition: 'HTTP 400: bad request'
  recovery: Fix the request (the response body carries a machine-readable code and message), then retry.
- condition: 'HTTP 404: Attribute not found'
  recovery: The referenced id does not exist; list the parent collection to find a valid id.
limits: []
depends_on: []
execution:
  preferred: api
  api:
    method: DELETE
    path: /contacts/attributes/{attributeCategory}/{attributeName}
    auth: api-key header (never store the value).
    operation_id: deleteAttribute
provenance:
  sources:
  - api_docs
  verification: documented_only
  verified_at: '2026-10-22'
  notes: 'Generated from the Brevo public API spec (SDK snapshot, Feb 2025). Not executed: the account had no API
    key. Also present in the live developer-site spec read on 2026-10-22.'
description: 'Author''s note (from the docs or from reading the spec; not verified): Removes the attribute and its
  values from all contacts.'
