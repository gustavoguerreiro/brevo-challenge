id: contacts.get_contact
domain: contacts
summary: 'Read one contact: attributes, list memberships, subscription status and recent activity.'
risk: read
reversible: true
requires_human_confirmation: false
plan_availability:
  free: available
preconditions:
- An API key (header api-key) that can access this account.
- Path value 'identifier' must identify an existing record.
inputs:
  type: object
  properties:
    identifier:
      type: string
      description: Email (urlencoded) OR ID of the contact OR its SMS attribute value
    startDate:
      type: string
      description: '**Mandatory if endDate is used.** Starting date (YYYY-MM-DD) of the statistic events specific
        to campaigns. Must be lower than equal to endDate'
    endDate:
      type: string
      description: '**Mandatory if startDate is used.** Ending date (YYYY-MM-DD) of the statistic events specific
        to campaigns. Must be greater than equal to startDate.'
  required:
  - identifier
outputs:
  allOf:
  - type: object
    required:
    - attributes
    - createdAt
    - emailBlacklisted
    - id
    - listIds
    - modifiedAt
    - smsBlacklisted
    properties:
      email:
        type: string
        format: email
        description: Email address of the contact for which you requested the details
      id:
        type: integer
        format: int64
        description: ID of the contact for which you requested the details
      emailBlacklisted:
        type: boolean
        description: Blacklist status for email campaigns (true=blacklisted, false=not blacklisted)
      smsBlacklisted:
        type: boolean
        description: Blacklist status for SMS campaigns (true=blacklisted, false=not blacklisted)
      createdAt:
        type: string
        description: Creation UTC date-time of the contact (YYYY-MM-DDTHH:mm:ss.SSSZ)
      modifiedAt:
        type: string
        description: Last modification UTC date-time of the contact (YYYY-MM-DDTHH:mm:ss.SSSZ)
      listIds:
        type: array
        items:
          type: integer
          format: int64
          description: List(s) in which the contact is included
      listUnsubscribed:
        type: array
        items:
          type: integer
          format: int64
          description: List(s) in which the contact is included (only available if unsubscription per list is activated
            for the account)
      attributes:
        type: object
        description: Set of attributes of the contact
        properties: {}
  - type: object
    required:
    - statistics
    properties:
      statistics:
        type: object
        properties:
          messagesSent:
            type: array
            description: Listing of the sent campaign for the contact
            items:
              type: object
              required:
              - campaignId
              - eventTime
              properties:
                campaignId:
                  type: integer
                  format: int64
                  description: ID of the campaign which generated the event
                eventTime:
                  type: string
                  description: UTC date-time of the event
          hardBounces:
            type: array
            description: Listing of the hardbounes generated by the contact
            items:
              type: object
              required:
              - campaignId
              - eventTime
              properties:
                campaignId:
                  type: integer
                  format: int64
                  description: ID of the campaign which generated the event
                eventTime:
                  type: string
                  description: UTC date-time of the event
          softBounces:
            type: array
            description: Listing of the softbounes generated by the contact
            items:
              type: object
              required:
              - campaignId
              - eventTime
              properties:
                campaignId:
                  type: integer
                  format: int64
                  description: ID of the campaign which generated the event
                eventTime:
                  type: string
                  description: UTC date-time of the event
          complaints:
            type: array
            description: Listing of the complaints generated by the contact
            items:
              type: object
              required:
              - campaignId
              - eventTime
              properties:
                campaignId:
                  type: integer
                  format: int64
                  description: ID of the campaign which generated the event
                eventTime:
                  type: string
                  description: UTC date-time of the event
          unsubscriptions:
            type: object
            required:
            - adminUnsubscription
            - userUnsubscription
            properties:
              userUnsubscription:
                type: array
                description: Contact unsubscribe via unsubscription link in a campaign
                items:
                  type: object
                  required:
                  - campaignId
                  - eventTime
                  properties:
                    campaignId:
                      type: integer
                      format: int64
                      description: ID of the campaign which generated the event
                    eventTime:
                      type: string
                      description: UTC date-time of the event
                    ip:
                      type: string
                      description: IP from which the user has unsubscribed
              adminUnsubscription:
                type: array
                description: Contact has been unsubscribed from the administrator
                items:
                  type: object
                  required:
                  - eventTime
                  properties:
                    eventTime:
                      type: string
                      description: UTC date-time of the event
                    ip:
                      type: string
                      description: IP from which the user has been unsubscribed
            description: Listing of the unsubscription for the contact
          opened:
            type: array
            description: Listing of the openings generated by the contact
            items:
              type: object
              required:
              - campaignId
              - count
              - eventTime
              - ip
              properties:
                campaignId:
                  type: integer
                  format: int64
                  description: ID of the campaign which generated the event
                count:
                  type: integer
                  format: int64
                  description: Number of openings for the campaign
                eventTime:
                  type: string
                  description: UTC date-time of the event
                ip:
                  type: string
                  description: IP from which the user has opened the email
          clicked:
            type: array
            description: Listing of the clicks generated by the contact
            items:
              type: object
              required:
              - campaignId
              - links
              properties:
                campaignId:
                  type: integer
                  format: int64
                  description: ID of the campaign which generated the event
                links:
                  type: array
                  description: Listing of the clicked links for the campaign
                  items:
                    type: object
                    required:
                    - count
                    - eventTime
                    - ip
                    - url
                    properties:
                      count:
                        type: integer
                        format: int64
                        description: Number of clicks on this link for the campaign
                      eventTime:
                        type: string
                        description: UTC date-time of the event
                      ip:
                        type: string
                        description: IP from which the user has clicked on the link
                      url:
                        type: string
                        description: URL of the clicked link
          transacAttributes:
            type: array
            description: Listing of the transactional attributes for the contact
            items:
              type: object
              properties: {}
          delivered:
            type: array
            description: Listing of the delivered campaign for the contact
            items:
              type: object
              required:
              - campaignId
              - eventTime
              properties:
                campaignId:
                  type: integer
                  format: int64
                  description: ID of the campaign which generated the event
                eventTime:
                  type: string
                  description: UTC date-time of the event
        description: Campaign statistics of the contact
side_effects:
- 'Expected (from the API docs, not verified): none; read only.'
postcondition_check: HTTP 200 with the requested data.
errors:
- condition: 'HTTP 400: bad request'
  recovery: Fix the request (the response body carries a machine-readable code and message), then retry.
- condition: 'HTTP 404: Contact''s email not found'
  recovery: The referenced id does not exist; list the parent collection to find a valid id.
limits: []
depends_on: []
execution:
  preferred: api
  api:
    method: GET
    path: /contacts/{identifier}
    auth: api-key header (never store the value).
    operation_id: getContactInfo
  ui:
    entry: /contact/index/<contact_id>
    steps:
    - Open CRM > Contatos and click a contact, or go to the URL with the numeric ID.
    - 'Tabs: Visão geral (Preferences, Informações, Pontuações [locked], Campanhas stats, Histórico recente, Empresas,
      Oportunidades), Histórico, Listas, Preferences.'
    - 'Action bar: Anotação, E-mail, Ligar, SMS, Tarefa, Mais (Reunião, Oportunidade, Arquivo, Adicionar à automação,
      Excluir definitivamente).'
    internal_service: contacts-api/contact/backend/contacts/<id>/header, /activities, /calc-attributes
provenance:
  sources:
  - api_docs
  - ui
  - network
  verification: executed_verified
  verified_at: '2026-10-22'
  notes: 'Read in the UI. Generated from the Brevo public API spec (SDK snapshot, Feb 2025). Not executed: the account
    had no API key. Also present in the live developer-site spec read on 2026-10-22.'
  verified_via:
  - ui
  evidence: evidence/contacts.update_contact.json
ui_label_pt: Página do contato
