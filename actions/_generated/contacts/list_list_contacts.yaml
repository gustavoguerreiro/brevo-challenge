id: contacts.list_list_contacts
domain: contacts
summary: Get contacts in a list.
risk: read
reversible: true
requires_human_confirmation: false
plan_availability:
  free: unknown
  note: Plan availability of this API call was not checked.
preconditions:
- An API key (header api-key) that can access this account.
- Path value 'listId' must identify an existing record.
inputs:
  type: object
  properties:
    listId:
      type: integer
      format: int64
      description: Id of the list
    modifiedSince:
      type: string
      description: Filter (urlencoded) the contacts modified after a given UTC date-time (YYYY-MM-DDTHH:mm:ss.SSSZ).
        Prefer to pass your timezone in date-time format for accurate result.
    limit:
      type: integer
      format: int64
      default: 50
      description: Number of documents per page
    offset:
      type: integer
      format: int64
      default: 0
      description: Index of the first document of the page
    sort:
      type: string
      enum:
      - asc
      - desc
      default: desc
      description: Sort the results in the ascending/descending order of record creation. Default order is **descending**
        if `sort` is not passed
  required:
  - listId
outputs:
  type: object
  required:
  - contacts
  - count
  properties:
    contacts:
      type: array
      items:
        type: object
        allOf:
        - type: object
          required:
          - attributes
          - createdAt
          - emailBlacklisted
          - id
          - listIds
          - modifiedAt
          - smsBlacklisted
          properties:
            email:
              type: string
              format: email
              description: Email address of the contact for which you requested the details
            id:
              type: integer
              format: int64
              description: ID of the contact for which you requested the details
            emailBlacklisted:
              type: boolean
              description: Blacklist status for email campaigns (true=blacklisted, false=not blacklisted)
            smsBlacklisted:
              type: boolean
              description: Blacklist status for SMS campaigns (true=blacklisted, false=not blacklisted)
            createdAt:
              type: string
              description: Creation UTC date-time of the contact (YYYY-MM-DDTHH:mm:ss.SSSZ)
            modifiedAt:
              type: string
              description: Last modification UTC date-time of the contact (YYYY-MM-DDTHH:mm:ss.SSSZ)
            listIds:
              type: array
              items:
                type: integer
                format: int64
                description: List(s) in which the contact is included
            listUnsubscribed:
              type: array
              items:
                type: integer
                format: int64
                description: List(s) in which the contact is included (only available if unsubscription per list
                  is activated for the account)
            attributes:
              type: object
              description: Set of attributes of the contact
              properties: {}
    count:
      type: integer
      format: int64
      description: Number of contacts
side_effects:
- 'Expected (from the API docs, not verified): none; read only.'
postcondition_check: HTTP 200 with the requested data.
errors:
- condition: 'HTTP 400: bad request'
  recovery: Fix the request (the response body carries a machine-readable code and message), then retry.
- condition: 'HTTP 404: List ID not found'
  recovery: The referenced id does not exist; list the parent collection to find a valid id.
limits: []
depends_on: []
execution:
  preferred: api
  api:
    method: GET
    path: /contacts/lists/{listId}/contacts
    auth: api-key header (never store the value).
    operation_id: getContactsFromList
provenance:
  sources:
  - api_docs
  verification: documented_only
  verified_at: '2026-10-22'
  notes: 'Generated from the Brevo public API spec (SDK snapshot, Feb 2025). Not executed: the account had no API
    key. Also present in the live developer-site spec read on 2026-10-22.'
