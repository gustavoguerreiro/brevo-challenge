id: contacts.list_lists
domain: contacts
summary: List contact lists with their folder, counts and paging.
risk: read
reversible: true
requires_human_confirmation: false
plan_availability:
  free: available
preconditions:
- An API key (header api-key) that can access this account.
inputs:
  type: object
  properties:
    limit:
      type: integer
      format: int64
      default: 10
      description: Number of documents per page
    offset:
      type: integer
      format: int64
      default: 0
      description: Index of the first document of the page
    sort:
      type: string
      enum:
      - asc
      - desc
      default: desc
      description: Sort the results in the ascending/descending order of record creation. Default order is **descending**
        if `sort` is not passed
outputs:
  type: object
  properties:
    lists:
      type: array
      description: Listing of all the lists available in your account
      items:
        type: object
        allOf:
        - type: object
          required:
          - id
          - name
          - totalBlacklisted
          - totalSubscribers
          - uniqueSubscribers
          properties:
            id:
              type: integer
              format: int64
              description: ID of the list
            name:
              type: string
              description: Name of the list
            totalBlacklisted:
              type: integer
              format: int64
              description: Number of blacklisted contacts in the list
            totalSubscribers:
              type: integer
              format: int64
              description: Number of contacts in the list
            uniqueSubscribers:
              type: integer
              format: int64
              description: Number of unique contacts in the list
        - type: object
          properties:
            folderId:
              type: integer
              format: int64
              description: ID of the folder
          required:
          - folderId
    count:
      type: integer
      format: int64
      description: Number of lists in your account
side_effects:
- 'Expected (from the API docs, not verified): none; read only.'
postcondition_check: HTTP 200 with the requested data.
errors:
- condition: 'HTTP 400: bad request'
  recovery: Fix the request (the response body carries a machine-readable code and message), then retry.
limits: []
depends_on: []
execution:
  preferred: api
  api:
    method: GET
    path: /contacts/lists
    auth: api-key header (never store the value).
    operation_id: getLists
  ui:
    entry: /contact/list-listing
    steps:
    - Open CRM > Contatos > Listas.
    - 'Columns: Listas, ID, Pasta, Contatos, Data de criação, Ações. Search box ''Pesquise um nome ou ID de lista''.
      The folder dropdown ''Todas as pastas (N listas)'' filters by folder.'
    - The system list 'identified_contacts' (ID 4, folder marketing_automation) exists in a new account next to
      'Sua primeira lista' (ID 2).
    internal_service: contacts-api-v2/lists/get-lists and lists/get-folders
provenance:
  sources:
  - api_docs
  - ui
  - network
  verification: executed_verified
  verified_at: '2026-10-22'
  notes: 'Read in the UI many times. Generated from the Brevo public API spec (SDK snapshot, Feb 2025). Not executed:
    the account had no API key. Also present in the live developer-site spec read on 2026-10-22.'
  verified_via:
  - ui
  evidence: evidence/contacts.update_list.json
ui_label_pt: Listas
