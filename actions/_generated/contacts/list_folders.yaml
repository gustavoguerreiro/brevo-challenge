id: contacts.list_folders
domain: contacts
summary: List the folders that group contact lists (system folders included).
risk: read
reversible: true
requires_human_confirmation: false
plan_availability:
  free: available
preconditions:
- An API key (header api-key) that can access this account.
inputs:
  type: object
  properties:
    limit:
      type: integer
      format: int64
      default: 10
      description: Number of documents per page
    offset:
      type: integer
      format: int64
      default: 0
      description: Index of the first document of the page
    sort:
      type: string
      enum:
      - asc
      - desc
      default: desc
      description: Sort the results in the ascending/descending order of record creation. Default order is **descending**
        if `sort` is not passed
  required:
  - limit
  - offset
outputs:
  type: object
  properties:
    folders:
      type: array
      items:
        type: object
        allOf:
        - type: object
          required:
          - id
          - name
          - totalBlacklisted
          - totalSubscribers
          - uniqueSubscribers
          properties:
            id:
              type: integer
              format: int64
              description: ID of the folder
            name:
              type: string
              description: Name of the folder
            totalBlacklisted:
              type: integer
              format: int64
              description: Number of blacklisted contacts in the folder
            totalSubscribers:
              type: integer
              format: int64
              description: Number of contacts in the folder
            uniqueSubscribers:
              type: integer
              format: int64
              description: Number of unique contacts in the folder
    count:
      type: integer
      format: int64
      description: Number of folders available in your account
side_effects:
- 'Expected (from the API docs, not verified): none; read only.'
postcondition_check: HTTP 200 with the requested data.
errors:
- condition: 'HTTP 400: bad request'
  recovery: Fix the request (the response body carries a machine-readable code and message), then retry.
limits: []
depends_on: []
execution:
  preferred: api
  api:
    method: GET
    path: /contacts/folders
    auth: api-key header (never store the value).
    operation_id: getFolders
  ui:
    entry: /contact/list-listing
    steps:
    - Open CRM > Contatos > Listas. Folder names appear in the 'Pasta' column and in the move panel.
provenance:
  sources:
  - api_docs
  - ui
  verification: executed_verified
  verified_at: '2026-10-22'
  notes: 'Read in the UI. UI view read; field-level equality with the API response was not tested (no API key).
    Generated from the Brevo public API spec (SDK snapshot, Feb 2025). Not executed: the account had no API key.
    Also present in the live developer-site spec read on 2026-10-22.'
  verified_via:
  - ui
  evidence: evidence/ui.read_pages.json
ui_label_pt: CRM > Listas (coluna Pasta)
