id: contacts.get_folder
domain: contacts
summary: Returns a folder's details.
risk: read
reversible: true
requires_human_confirmation: false
plan_availability:
  free: unknown
  note: Plan availability of this API call was not checked.
preconditions:
- An API key (header api-key) that can access this account.
- Path value 'folderId' must identify an existing record.
inputs:
  type: object
  properties:
    folderId:
      type: integer
      format: int64
      description: id of the folder
  required:
  - folderId
outputs:
  type: object
  required:
  - id
  - name
  - totalBlacklisted
  - totalSubscribers
  - uniqueSubscribers
  properties:
    id:
      type: integer
      format: int64
      description: ID of the folder
    name:
      type: string
      description: Name of the folder
    totalBlacklisted:
      type: integer
      format: int64
      description: Number of blacklisted contacts in the folder
    totalSubscribers:
      type: integer
      format: int64
      description: Number of contacts in the folder
    uniqueSubscribers:
      type: integer
      format: int64
      description: Number of unique contacts in the folder
side_effects:
- 'Expected (from the API docs, not verified): none; read only.'
postcondition_check: HTTP 200 with the requested data.
errors:
- condition: 'HTTP 400: bad request'
  recovery: Fix the request (the response body carries a machine-readable code and message), then retry.
- condition: 'HTTP 404: Folder ID not found'
  recovery: The referenced id does not exist; list the parent collection to find a valid id.
limits: []
depends_on: []
execution:
  preferred: api
  api:
    method: GET
    path: /contacts/folders/{folderId}
    auth: api-key header (never store the value).
    operation_id: getFolder
