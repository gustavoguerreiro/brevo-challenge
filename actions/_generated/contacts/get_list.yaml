id: contacts.get_list
domain: contacts
summary: Get a list's details.
risk: read
reversible: true
requires_human_confirmation: false
plan_availability:
  free: unknown
  note: Plan availability of this API call was not checked.
preconditions:
- An API key (header api-key) that can access this account.
- Path value 'listId' must identify an existing record.
inputs:
  type: object
  properties:
    listId:
      type: integer
      format: int64
      description: Id of the list
    startDate:
      type: string
      description: Mandatory if endDate is used. Ending (urlencoded) UTC date-time (YYYY-MM-DDTHH:mm:ss.SSSZ) to
        aggregate the sent email campaigns for a specific list id.Prefer to pass your timezone in date-time format
        for accurate result
    endDate:
      type: string
      description: Mandatory if startDate is used. Ending (urlencoded) UTC date-time (YYYY-MM-DDTHH:mm:ss.SSSZ)
        to aggregate the sent email campaigns for a specific list id.Prefer to pass your timezone in date-time format
        for accurate result
  required:
  - listId
outputs:
  allOf:
  - type: object
    required:
    - id
    - name
    - totalBlacklisted
    - totalSubscribers
    - uniqueSubscribers
    properties:
      id:
        type: integer
        format: int64
        description: ID of the list
      name:
        type: string
        description: Name of the list
      totalBlacklisted:
        type: integer
        format: int64
        description: Number of blacklisted contacts in the list
      totalSubscribers:
        type: integer
        format: int64
        description: Number of contacts in the list
      uniqueSubscribers:
        type: integer
        format: int64
        description: Number of unique contacts in the list
  - type: object
    required:
    - createdAt
    - folderId
    properties:
      folderId:
        type: integer
        format: int64
        description: ID of the folder
      createdAt:
        type: string
        description: Creation UTC date-time of the list (YYYY-MM-DDTHH:mm:ss.SSSZ)
      campaignStats:
        type: array
        items:
          type: object
          required:
          - campaignId
          - stats
          properties:
            campaignId:
              type: integer
              format: int64
              description: ID of the campaign
            stats:
              type: object
              required:
              - clickers
              - complaints
              - delivered
              - hardBounces
              - sent
              - softBounces
              - trackableViews
              - uniqueClicks
              - uniqueViews
              - unsubscriptions
              - viewed
              properties:
                listId:
                  type: integer
                  format: int64
                  description: List Id of email campaign (only in case of get email campaign(s)(not for global stats))
                uniqueClicks:
                  type: integer
                  format: int64
                  description: Number of unique clicks for the campaign
                clickers:
                  type: integer
                  format: int64
                  description: Number of total clicks for the campaign
                complaints:
                  type: integer
                  format: int64
                  description: Number of complaints (Spam reports) for the campaign
                delivered:
                  type: integer
                  format: int64
                  description: Number of delivered emails for the campaign
                sent:
                  type: integer
                  format: int64
                  description: Number of sent emails for the campaign
                softBounces:
                  type: integer
                  format: int64
                  description: Number of softbounce for the campaign
                hardBounces:
                  type: integer
                  format: int64
                  description: Number of harbounce for the campaign
                uniqueViews:
                  type: integer
                  format: int64
                  description: Number of unique openings for the campaign
                trackableViews:
                  type: integer
                  format: int64
                  description: Recipients without any privacy protection option enabled in their email client
                trackableViewsRate:
                  type: number
                  format: float
                  description: Rate of recipients without any privacy protection option enabled in their email client
                estimatedViews:
                  type: integer
                  format: int64
                  description: Rate of recipients without any privacy protection option enabled in their email client,
                    applied to all delivered emails
                unsubscriptions:
                  type: integer
                  format: int64
                  description: Number of unsubscription for the campaign
                viewed:
                  type: integer
                  format: int64
                  description: Number of openings for the campaign
                deferred:
                  type: integer
                  format: int64
                  description: Number of deferred emails for the campaign
                returnBounce:
                  type: integer
                  format: int64
                  description: Total number of non-delivered campaigns for a particular campaign id.
      dynamicList:
        type: boolean
        description: Status telling if the list is dynamic or not (true=dynamic, false=not dynamic)
side_effects:
- 'Expected (from the API docs, not verified): none; read only.'
postcondition_check: HTTP 200 with the requested data.
errors:
- condition: 'HTTP 400: bad request'
  recovery: Fix the request (the response body carries a machine-readable code and message), then retry.
- condition: 'HTTP 404: List ID not found'
  recovery: The referenced id does not exist; list the parent collection to find a valid id.
limits: []
depends_on: []
execution:
  preferred: api
  api:
    method: GET
    path: /contacts/lists/{listId}
    auth: api-key header (never store the value).
    operation_id: getList
provenance:
  sources:
  - api_docs
  verification: documented_only
  verified_at: '2026-10-22'
  notes: 'Generated from the Brevo public API spec (SDK snapshot, Feb 2025). Not executed: the account had no API
    key. Also present in the live developer-site spec read on 2026-10-22.'
