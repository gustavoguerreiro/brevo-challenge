id: reporting.list_sms_daily_reports
domain: reporting
summary: Get your SMS activity aggregated per day.
risk: read
reversible: true
requires_human_confirmation: false
plan_availability:
  free: unknown
  note: Plan availability of this API call was not checked.
preconditions:
- An API key (header api-key) that can access this account.
inputs:
  type: object
  properties:
    startDate:
      type: string
      description: Mandatory if endDate is used. Starting date (YYYY-MM-DD) of the report
    endDate:
      type: string
      description: Mandatory if startDate is used. Ending date (YYYY-MM-DD) of the report
    days:
      type: integer
      format: int64
      description: Number of days in the past including today (positive integer). Not compatible with 'startDate'
        and 'endDate'
    tag:
      type: string
      description: Filter on a tag
    sort:
      type: string
      enum:
      - asc
      - desc
      default: desc
      description: Sort the results in the ascending/descending order of record creation. Default order is **descending**
        if `sort` is not passed
outputs:
  type: object
  properties:
    reports:
      type: array
      items:
        type: object
        properties:
          date:
            type: string
            format: date
            description: Date for which statistics are retrieved
          requests:
            type: integer
            format: int64
            description: Number of requests for the date
          delivered:
            type: integer
            format: int64
            description: Number of delivered SMS for the date
          hardBounces:
            type: integer
            format: int64
            description: Number of hardbounces for the date
          softBounces:
            type: integer
            format: int64
            description: Number of softbounces for the date
          blocked:
            type: integer
            format: int64
            description: Number of blocked contact for the date
          unsubscribed:
            type: integer
            format: int64
            description: Number of unsubscription for the date
          replied:
            type: integer
            format: int64
            description: Number of answered SMS for the date
          accepted:
            type: integer
            format: int64
            description: Number of accepted SMS for the date
          rejected:
            type: integer
            format: int64
            description: Number of rejected SMS for the date
          skipped:
            type: integer
            format: int64
            description: Number of skipped SMS for the date
side_effects:
- 'Expected (from the API docs, not verified): none; read only.'
postcondition_check: HTTP 200 with the requested data.
errors:
- condition: 'HTTP 400: bad request'
  recovery: Fix the request (the response body carries a machine-readable code and message), then retry.
limits: []
depends_on: []
execution:
  preferred: api
  api:
    method: GET
    path: /transactionalSMS/statistics/reports
    auth: api-key header (never store the value).
    operation_id: getTransacSmsReport
provenance:
  sources:
  - api_docs
  verification: documented_only
  verified_at: '2026-10-22'
  notes: 'Generated from the Brevo public API spec (SDK snapshot, Feb 2025). Not executed: the account had no API
    key. Also present in the live developer-site spec read on 2026-10-22.'
