id: reporting.list_whatsapp_events
domain: reporting
summary: Get all your WhatsApp activity (unaggregated events).
risk: read
reversible: true
requires_human_confirmation: false
plan_availability:
  free: unknown
  note: Plan availability of this API call was not checked.
preconditions:
- An API key (header api-key) that can access this account.
inputs:
  type: object
  properties:
    limit:
      type: integer
      format: int64
      default: 2500
      description: Number limitation for the result returned
    offset:
      type: integer
      format: int64
      default: 0
      description: Beginning point in the list to retrieve from
    startDate:
      type: string
      description: '**Mandatory if endDate is used.** Starting date of the report (YYYY-MM-DD). Must be lower than
        equal to endDate'
    endDate:
      type: string
      description: '**Mandatory if startDate is used.** Ending date of the report (YYYY-MM-DD). Must be greater
        than equal to startDate'
    days:
      type: integer
      format: int64
      description: Number of days in the past including today (positive integer). _Not compatible with 'startDate'
        and 'endDate'_
    contactNumber:
      type: string
      format: mobile
      description: Filter results for specific contact (WhatsApp Number with country code. Example, 85264318721)
    event:
      type: string
      enum:
      - sent
      - delivered
      - read
      - error
      - unsubscribe
      - reply
      - soft-bounce
      description: Filter the report for a specific event type
    sort:
      type: string
      enum:
      - asc
      - desc
      default: desc
      description: Sort the results in the ascending/descending order of record creation. Default order is **descending**
        if `sort` is not passed
outputs:
  type: object
  properties:
    events:
      type: array
      items:
        type: object
        required:
        - contactNumber
        - date
        - event
        - messageId
        - senderNumber
        properties:
          contactNumber:
            type: string
            format: mobile
            description: WhatsApp Number with country code. Example, 85264318721
          date:
            type: string
            description: UTC date-time on which the event has been generated
          messageId:
            type: string
            description: Message ID which generated the event
          event:
            type: string
            description: Event which occurred
            enum:
            - sent
            - delivered
            - read
            - error
            - unsubscribe
            - reply
            - soft-bounce
          reason:
            type: string
            description: Reason for the event (will be there in case of `error` and `soft-bounce` events)
          body:
            type: string
            description: Text of the reply (will be there only in case of `reply` event with text)
          mediaUrl:
            type: string
            format: url
            description: Url of the media reply (will be there only in case of `reply` event with media)
          senderNumber:
            type: string
            format: mobile
            description: WhatsApp Number with country code. Example, 85264318721
side_effects:
- 'Expected (from the API docs, not verified): none; read only.'
postcondition_check: HTTP 200 with the requested data.
errors:
- condition: 'HTTP 400: bad request'
  recovery: Fix the request (the response body carries a machine-readable code and message), then retry.
limits: []
depends_on: []
execution:
  preferred: api
  api:
    method: GET
    path: /whatsapp/statistics/events
    auth: api-key header (never store the value).
    operation_id: getWhatsappEventReport
provenance:
  sources:
  - api_docs
  verification: documented_only
  verified_at: '2026-10-22'
  notes: 'Generated from the Brevo public API spec (SDK snapshot, Feb 2025). Not executed: the account had no API
    key. Also present in the live developer-site spec read on 2026-10-22.'
