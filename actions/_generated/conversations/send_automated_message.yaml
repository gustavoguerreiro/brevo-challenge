id: conversations.send_automated_message
domain: conversations
summary: Send an automated message to a visitor.
risk: external_effect
reversible: false
requires_human_confirmation: true
plan_availability:
  free: unknown
  note: Plan availability not checked.
preconditions:
- An API key (header api-key) that can access this account.
inputs:
  type: object
  properties:
    visitorId:
      type: string
      description: visitor’s ID received <a href="https://developers.brevo.com/docs/conversations-webhooks">from
        a webhook</a> or generated by you to <a href="https://developers.brevo.com/docs/customize-the-widget#identifying-existing-users">bind
        existing …
      x-in: body
    text:
      type: string
      description: message text
      x-in: body
    agentId:
      type: string
      description: agent ID. It can be found on agent’s page or received <a href="https://developers.brevo.com/docs/conversations-webhooks">from
        a webhook</a>. Optional if `groupId` is set.
      x-in: body
    groupId:
      type: string
      description: group ID. It can be found on group’s page. Optional if `agentId` is set.
      x-in: body
  required:
  - text
  - visitorId
outputs:
  type: object
  properties:
    id:
      type: string
      description: Message ID. It can be used for further manipulations with the message.
    type:
      type: string
      description: '`"agent"` for agents’ messages, `"visitor"` for visitors’ messages.'
      enum:
      - agent
      - visitor
    text:
      type: string
      description: Message text or name of the attached file
    visitorId:
      type: string
      description: visitor’s ID
    agentId:
      type: string
      description: ID of the agent on whose behalf the message was sent (only in messages sent by an agent).
    agentName:
      type: string
      description: Agent’s name as displayed to the visitor. Only in the messages sent by an agent.
    createdAt:
      type: integer
      format: int64
      description: Timestamp in milliseconds.
      minimum: 0
    isPushed:
      type: boolean
      description: '`true` for pushed messages'
    receivedFrom:
      type: string
      description: In two-way integrations, messages sent via REST API can be marked with receivedFrom property
        and then filtered out when received in a webhook to avoid infinite loop.
    file:
      type: object
      properties:
        filename:
          type: string
          description: Name of the file
        size:
          type: integer
          format: int64
          description: Size in bytes
          minimum: 0
        isImage:
          type: boolean
          description: Whether the file is an image
        url:
          type: string
          format: url
          description: URL of the file
        imageInfo:
          type: object
          properties:
            width:
              type: integer
              format: int64
              description: Width of the image
              minimum: 0
            height:
              type: integer
              format: int64
              description: height of the image
              minimum: 0
            previewUrl:
              type: string
              format: url
              description: URL of the preview
          description: image info is passed in case the file is an image
  description: a Conversations message
side_effects:
- 'Expected (from the API docs, not verified): An automated chat message is pushed to the visitor.'
- 'Expected (from the API docs, not verified): reaches real recipients or third parties and cannot be recalled.'
postcondition_check: HTTP 2xx with a message id or empty body; confirm delivery in the matching logs or statistics
  action.
errors:
- condition: 'HTTP 400: Returned when invalid data posted'
  recovery: Fix the request (the response body carries a machine-readable code and message), then retry.
limits: []
depends_on: []
execution:
  preferred: api
  api:
    method: POST
    path: /conversations/pushedMessages
    auth: api-key header (never store the value).
provenance:
  sources:
  - api_docs
  verification: documented_only
  verified_at: '2026-10-22'
  notes: 'Generated from the Brevo public API spec (SDK snapshot, Feb 2025). Not executed: the account had no API
    key. Also present in the live developer-site spec read on 2026-10-22.'
description: 'Author''s note (from the docs or from reading the spec; not verified): Pushes an automated chat message
  to a visitor.'
