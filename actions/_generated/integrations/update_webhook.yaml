id: integrations.update_webhook
domain: integrations
summary: Change a webhook's URL or events; a new URL starts receiving contact data.
risk: external_effect
reversible: false
requires_human_confirmation: true
plan_availability:
  free: unknown
  note: Plan availability of this API call was not checked.
preconditions:
- An API key (header api-key) that can access this account.
- Path value 'webhookId' must identify an existing record.
inputs:
  type: object
  properties:
    webhookId:
      type: integer
      format: int64
      description: Id of the webhook
    url:
      type: string
      format: url
      description: URL of the webhook
      x-in: body
    description:
      type: string
      description: Description of the webhook
      x-in: body
    events:
      type: array
      description: '- Events triggering the webhook. Possible values for **Transactional** type webhook: #### `sent`
        OR `request`, `delivered`, `hardBounce`, `softBounce`, `blocked`, `spam`, `invalid`, `deferred`, `click`,
        `opened`, `uniqueOpened` and …'
      items:
        type: string
        enum:
        - sent
        - hardBounce
        - softBounce
        - blocked
        - spam
        - delivered
        - request
        - click
        - invalid
        - deferred
        - opened
        - uniqueOpened
        - unsubscribed
        - listAddition
        - contactUpdated
        - contactDeleted
        - inboundEmailProcessed
      x-in: body
    domain:
      type: string
      description: Inbound domain of webhook, used in case of event type `inbound`
      x-in: body
    batched:
      type: boolean
      description: To send batched webhooks
      x-in: body
    auth:
      type: object
      properties:
        type:
          type: string
          description: Type of authentication
        token:
          type: string
          description: Webhook authentication token
      description: Add authentication on webhook url
      x-in: body
    headers:
      type: array
      description: Custom headers to be send with webhooks
      items:
        type: object
        properties:
          key:
            type: string
            description: Header key name
          value:
            type: string
            description: Header value
      x-in: body
  required:
  - webhookId
side_effects:
- 'Expected (from the API docs, not verified): reaches real recipients or third parties and cannot be recalled.'
postcondition_check: HTTP 204 (or 200); read the item back with its get_/list_ action and compare the fields you
  changed.
errors:
- condition: 'HTTP 400: bad request'
  recovery: Fix the request (the response body carries a machine-readable code and message), then retry.
- condition: 'HTTP 404: Webhook ID not found'
  recovery: The referenced id does not exist; list the parent collection to find a valid id.
limits: []
depends_on: []
execution:
  preferred: api
  api:
    method: PUT
    path: /webhooks/{webhookId}
    auth: api-key header (never store the value).
    operation_id: updateWebhook
provenance:
  sources:
  - api_docs
  verification: documented_only
  verified_at: '2026-10-22'
  notes: 'Generated from the Brevo public API spec (SDK snapshot, Feb 2025). Not executed: the account had no API
    key. Also present in the live developer-site spec read on 2026-10-22.'
description: 'Author''s note (from the docs or from reading the spec; not verified): Changing the URL sends contact
  data to the new address.'
