id: integrations.export_webhook_history
domain: integrations
summary: Export all webhook events.
risk: write
reversible: true
requires_human_confirmation: false
plan_availability:
  free: unknown
  note: Plan availability of this API call was not checked.
preconditions:
- An API key (header api-key) that can access this account.
inputs:
  type: object
  properties:
    days:
      type: integer
      description: Number of days in the past including today (positive integer). _Not compatible with 'startDate'
        and 'endDate'_
      x-in: body
    startDate:
      type: string
      description: Mandatory if endDate is used. Starting date of the history (YYYY-MM-DD). Must be lower than equal
        to endDate
      x-in: body
    endDate:
      type: string
      description: Mandatory if startDate is used. Ending date of the report (YYYY-MM-DD). Must be greater than
        equal to startDate
      x-in: body
    sort:
      type: string
      description: Sorting order of records (asc or desc)
      x-in: body
    type:
      type: string
      description: Filter the history based on webhook type
      enum:
      - transactional
      - marketing
      x-in: body
    event:
      type: string
      description: Filter the history for a specific event type
      enum:
      - invalid_parameter
      - missing_parameter
      - hardBounce
      - softBounce
      - delivered
      - spam
      - request
      - opened
      - click
      - invalid
      - deferred
      - blocked
      - unsubscribed
      - error
      - uniqueOpened
      - loadedByProxy
      - allEvents
      x-in: body
    notifyURL:
      type: string
      description: Webhook URL to receive CSV file link
      x-in: body
    webhookId:
      type: integer
      description: Filter the history for a specific webhook id
      x-in: body
    email:
      type: string
      description: Filter the history for a specific email
      x-in: body
    messageId:
      type: integer
      description: Filter the history for a specific message id. Applicable only for transactional webhooks.
      x-in: body
  required:
  - event
  - notifyURL
  - type
outputs:
  type: object
  required:
  - processId
  properties:
    processId:
      type: integer
      format: int64
      description: Id of the process created
side_effects:
- 'Expected (from the API docs, not verified): changes account data.'
postcondition_check: HTTP 2xx; read the affected item back to confirm.
errors:
- condition: 'HTTP 400: bad request'
  recovery: Fix the request (the response body carries a machine-readable code and message), then retry.
limits: []
depends_on: []
execution:
  preferred: api
  api:
    method: POST
    path: /webhooks/export
    auth: api-key header (never store the value).
    operation_id: exportWebhooksHistory
provenance:
  sources:
  - api_docs
  verification: documented_only
  verified_at: '2026-10-22'
  notes: 'Generated from the Brevo public API spec (SDK snapshot, Feb 2025). Not executed: the account had no API
    key. Also present in the live developer-site spec read on 2026-10-22.'
