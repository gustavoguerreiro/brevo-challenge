id: integrations.get_external_feed
domain: integrations
summary: Get an external feed by UUID.
risk: read
reversible: true
requires_human_confirmation: false
plan_availability:
  free: unknown
  note: Plan availability of this API call was not checked.
preconditions:
- An API key (header api-key) that can access this account.
- Path value 'uuid' must identify an existing record.
inputs:
  type: object
  properties:
    uuid:
      type: string
      description: UUID of the feed to fetch
  required:
  - uuid
outputs:
  type: object
  required:
  - authType
  - cache
  - createdAt
  - headers
  - id
  - maxRetries
  - modifiedAt
  - name
  - url
  properties:
    id:
      type: string
      format: uuidv4
      description: ID of the feed
    name:
      type: string
      description: Name of the feed
    url:
      type: string
      format: url
      description: URL of the feed
    authType:
      type: string
      description: 'Auth type of the feed: * `basic` * `token` * `noAuth`'
      enum:
      - basic
      - token
      - noAuth
    username:
      type: string
      description: Username for authType `basic`
    password:
      type: string
      description: Password for authType `basic`
    token:
      type: string
      description: Token for authType `token`
    headers:
      type: array
      description: Custom headers for the feed
      items:
        type: object
        properties:
          name:
            type: string
            description: Name of the header
          value:
            type: string
            description: Value of the header
    maxRetries:
      type: integer
      description: Maximum number of retries on the feed url
      minimum: 0
      maximum: 5
    cache:
      type: boolean
      description: Toggle caching of feed url response
    createdAt:
      type: string
      format: date-time
      description: Datetime on which the feed was created
    modifiedAt:
      type: string
      format: date-time
      description: Datetime on which the feed was modified
side_effects:
- 'Expected (from the API docs, not verified): none; read only.'
postcondition_check: HTTP 200 with the requested data.
errors:
- condition: 'HTTP 400: bad request'
  recovery: Fix the request (the response body carries a machine-readable code and message), then retry.
- condition: 'HTTP 404: Feed not found'
  recovery: The referenced id does not exist; list the parent collection to find a valid id.
limits: []
depends_on: []
execution:
  preferred: api
  api:
    method: GET
    path: /feeds/{uuid}
    auth: api-key header (never store the value).
    operation_id: getExternalFeedByUUID
provenance:
  sources:
  - api_docs
  verification: documented_only
  verified_at: '2026-10-22'
  notes: 'Generated from the Brevo public API spec (SDK snapshot, Feb 2025). Not executed: the account had no API
    key. Also present in the live developer-site spec read on 2026-10-22.'
