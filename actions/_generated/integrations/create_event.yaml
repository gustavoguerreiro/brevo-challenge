id: integrations.create_event
domain: integrations
summary: Record a custom event for a contact (track API); events can trigger automations.
risk: write
reversible: true
requires_human_confirmation: false
plan_availability:
  free: unknown
  note: Plan availability of this API call was not checked.
preconditions:
- An API key (header api-key) that can access this account.
inputs:
  type: object
  properties:
    event_name:
      type: string
      description: The name of the event that occurred. This is how you will find your event in Brevo. Limited to
        255 characters, alphanumerical characters and - _ only.
      x-in: body
    event_date:
      type: string
      description: Timestamp of when the event occurred (e.g. "2024-01-24T17:39:57+01:00"). If no value is passed,
        the timestamp of the event creation is used.
      x-in: body
    identifiers:
      type: object
      properties:
        email_id:
          type: string
          description: Email Id associated with the event
        phone_id:
          type: string
          description: SMS associated with the event
        whatsapp_id:
          type: string
          description: whatsapp associated with the event
        landline_number_id:
          type: string
          description: landline_number associated with the event
        ext_id:
          type: string
          description: ext_id associated with the event
      description: Identifies the contact associated with the event. At least one identifier is required.
      x-in: body
    contact_properties:
      type: object
      description: 'Properties defining the state of the contact associated to this event. Useful to update contact
        attributes defined in your contacts database while passing the event. For example: **"FIRSTNAME": "Jane"
        , "AGE": 37**'
      properties: {}
      x-in: body
    event_properties:
      type: object
      description: 'Properties of the event. Top level properties and nested properties can be used to better segment
        contacts and personalise workflow conditions. The following field type are supported: string, number, boolean
        (true/false), date (Timestamp …'
      properties: {}
      x-in: body
  required:
  - event_name
  - identifiers
side_effects:
- 'Expected (from the API docs, not verified): Custom events can trigger automations and appear in segments.'
postcondition_check: HTTP 201 (or 200) returning the new id; read the item back with its get_/list_ action to confirm.
errors:
- condition: 'HTTP 400: bad request'
  recovery: Fix the request (the response body carries a machine-readable code and message), then retry.
- condition: 'HTTP 401: unauthorized'
  recovery: Check the api-key header; the key may be missing, revoked or restricted by IP.
limits: []
depends_on: []
execution:
  preferred: api
  api:
    method: POST
    path: /events
    auth: api-key header (never store the value).
    operation_id: createEvent
provenance:
  sources:
  - api_docs
  verification: documented_only
  verified_at: '2026-10-22'
  notes: 'Generated from the Brevo public API spec (SDK snapshot, Feb 2025). Not executed: the account had no API
    key. Also present in the live developer-site spec read on 2026-10-22.'
description: 'Author''s note (from the docs or from reading the spec; not verified): Custom events can trigger automations
  and appear in segments.'
