id: ecommerce.list_orders
domain: ecommerce
summary: Get order details.
risk: read
reversible: true
requires_human_confirmation: false
plan_availability:
  free: limited
  note: Needs the e-commerce integration or activation (UI shows a plug-in prompt on a new account).
preconditions:
- An API key (header api-key) that can access this account.
inputs:
  type: object
  properties:
    limit:
      type: integer
      format: int64
      default: 50
      description: Number of documents per page
    offset:
      type: integer
      format: int64
      default: 0
      description: Index of the first document in the page
    sort:
      type: string
      enum:
      - asc
      - desc
      default: desc
      description: Sort the results in the ascending/descending order of record creation. Default order is **descending**
        if `sort` is not passed
    modifiedSince:
      type: string
      description: Filter (urlencoded) the orders modified after a given UTC date-time (YYYY-MM-DDTHH:mm:ss.SSSZ).
        **Prefer to pass your timezone in date-time format for accurate result.**
    createdSince:
      type: string
      description: Filter (urlencoded) the orders created after a given UTC date-time (YYYY-MM-DDTHH:mm:ss.SSSZ).
        **Prefer to pass your timezone in date-time format for accurate result.**
outputs:
  type: object
  properties:
    orders:
      type: array
      items:
        type: object
        allOf:
        - type: object
          properties:
            contact_id:
              type: integer
              format: int64
              description: Contact ID for the order
        - type: object
          required:
          - amount
          - createdAt
          - id
          - products
          - status
          - updatedAt
          properties:
            id:
              type: string
              description: Unique ID of the order.
            createdAt:
              type: string
              description: Event occurrence UTC date-time (YYYY-MM-DDTHH:mm:ssZ), when order is actually created.
            updatedAt:
              type: string
              description: Event updated UTC date-time (YYYY-MM-DDTHH:mm:ssZ), when the status of the order is actually
                changed/updated.
            status:
              type: string
              description: State of the order.
            amount:
              type: number
              description: Total amount of the order, including all shipping expenses, tax and the price of items.
            storeId:
              type: string
              description: ID of store where the order is placed
            products:
              type: array
              items:
                type: object
                required:
                - price
                - productId
                - quantity
                properties:
                  productId:
                    type: string
                    description: ID of the product.
                  quantity:
                    type: number
                    description: How many pieces of the product the visitor has added to the cart.
                  variantId:
                    type: string
                    description: Product ID of the red color shirts.
                  price:
                    type: number
                    description: The price of a unit of product
                description: Details for the Products in an order.
            email:
              type: string
              description: Email of the contact, Mandatory if "phone" field is not passed in "billing" parameter.
            billing:
              type: object
              properties:
                address:
                  type: string
                  description: Full billing address.
                city:
                  type: string
                  description: Exact city of the address.
                countryCode:
                  type: string
                  description: Billing country 2-letter ISO code.
                country:
                  type: string
                  description: Billing country name.
                phone:
                  type: string
                  description: Phone number to contact for further details about the order, Mandatory if "email"
                    field is not passed.
                postCode:
                  type: string
                  description: Postcode for delivery and billing.
                paymentMethod:
                  type: string
                  description: How the visitor will pay for the item(s), e.g. paypal, check, etc.
                region:
                  type: string
                  description: Exact region (state/province) for delivery and billing.
              description: Billing details of an order.
            coupons:
              type: array
              description: Coupons applied to the order. Stored case insensitive.
              items:
                type: string
    count:
      type: integer
      format: int64
      description: Number of orders
side_effects:
- 'Expected (from the API docs, not verified): none; read only.'
postcondition_check: HTTP 200 with the requested data.
errors:
- condition: 'HTTP 400: bad request'
  recovery: Fix the request (the response body carries a machine-readable code and message), then retry.
limits: []
depends_on: []
execution:
  preferred: api
  api:
    method: GET
    path: /orders
    auth: api-key header (never store the value).
    operation_id: getOrders
provenance:
  sources:
  - api_docs
  verification: documented_only
  verified_at: '2026-10-22'
  notes: 'Generated from the Brevo public API spec (SDK snapshot, Feb 2025). Not executed: the account had no API
    key. Also present in the live developer-site spec read on 2026-10-22.'
