id: ecommerce.delete_payment_request
domain: ecommerce
summary: Delete a payment request (destructive; confirm first).
risk: destructive
reversible: false
requires_human_confirmation: true
plan_availability:
  free: limited
  note: Needs the e-commerce integration or activation (UI shows a plug-in prompt on a new account).
preconditions:
- An API key (header api-key) that can access this account.
- Path value 'id' must identify an existing record.
inputs:
  type: object
  properties:
    id:
      type: string
      description: ID of the payment request.
  required:
  - id
side_effects:
- 'Expected (from the API docs, not verified): removes data; the public API documents no undo.'
postcondition_check: HTTP 204 (or 200); then a get_ of the same id should answer 404 (expected, not tested).
errors:
- condition: 'HTTP 401: Unauthorized.'
  recovery: Check the api-key header; the key may be missing, revoked or restricted by IP.
- condition: 'HTTP 403: Permission denied. Either you don''t have access to Brevo Payments or your Brevo Payments
    account is not validated.'
  recovery: The key or plan lacks permission for this operation; check key permissions and plan features.
- condition: 'HTTP 404: Payment request not found.'
  recovery: The referenced id does not exist; list the parent collection to find a valid id.
limits: []
depends_on: []
execution:
  preferred: api
  api:
    method: DELETE
    path: /payments/requests/{id}
    auth: api-key header (never store the value).
    operation_id: deletePaymentRequest
provenance:
  sources:
  - api_docs
  verification: documented_only
  verified_at: '2026-10-22'
  notes: 'Generated from the Brevo public API spec (SDK snapshot, Feb 2025). Not executed: the account had no API
    key. Also present in the live developer-site spec read on 2026-10-22.'
