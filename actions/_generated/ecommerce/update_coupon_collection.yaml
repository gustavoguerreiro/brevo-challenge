id: ecommerce.update_coupon_collection
domain: ecommerce
summary: Update a coupon collection by id.
risk: write
reversible: true
requires_human_confirmation: false
plan_availability:
  free: limited
  note: Needs the e-commerce integration or activation (UI shows a plug-in prompt on a new account).
preconditions:
- An API key (header api-key) that can access this account.
- Path value 'id' must identify an existing record.
inputs:
  type: object
  properties:
    id:
      type: string
      format: uuidv4
      description: Id of the collection to update
    defaultCoupon:
      type: string
      description: A default coupon to be used in case there are no coupons left
      x-in: body
    expirationDate:
      type: string
      format: date-time
      description: Specify an expiration date for the coupon collection in RFC3339 format. Use null to remove the
        expiration date.
      x-in: body
    remainingDaysAlert:
      type: integer
      description: Send a notification alert (email) when the remaining days until the expiration date are equal
        or fall bellow this number. Use null to disable alerts.
      x-in: body
    remainingCouponsAlert:
      type: integer
      description: Send a notification alert (email) when the remaining coupons count is equal or fall bellow this
        number. Use null to disable alerts.
      x-in: body
  required:
  - id
outputs:
  type: object
  required:
  - id
  - name
  properties:
    id:
      type: string
      format: uuidv4
      description: The id of the collection
    name:
      type: string
      format: uuidv4
      description: The name of the collection
    defaultCoupon:
      type: string
      description: The default coupon of the collection
side_effects:
- 'Expected (from the API docs, not verified): changes account data.'
postcondition_check: HTTP 204 (or 200); read the item back with its get_/list_ action and compare the fields you
  changed.
errors:
- condition: 'HTTP 400: bad request'
  recovery: Fix the request (the response body carries a machine-readable code and message), then retry.
- condition: 'HTTP 401: unauthorized'
  recovery: Check the api-key header; the key may be missing, revoked or restricted by IP.
limits: []
depends_on: []
execution:
  preferred: api
  api:
    method: PATCH
    path: /couponCollections/{id}
    auth: api-key header (never store the value).
    operation_id: updateCouponCollection
provenance:
  sources:
  - api_docs
  verification: documented_only
  verified_at: '2026-10-22'
  notes: 'Generated from the Brevo public API spec (SDK snapshot, Feb 2025). Not executed: the account had no API
    key. Also present in the live developer-site spec read on 2026-10-22.'
