id: ecommerce.list_categories
domain: ecommerce
summary: Return all your categories.
risk: read
reversible: true
requires_human_confirmation: false
plan_availability:
  free: limited
  note: Needs the e-commerce integration or activation (UI shows a plug-in prompt on a new account).
preconditions:
- An API key (header api-key) that can access this account.
inputs:
  type: object
  properties:
    limit:
      type: integer
      format: int64
      default: 50
      description: Number of documents per page
    offset:
      type: integer
      format: int64
      default: 0
      description: Index of the first document in the page
    sort:
      type: string
      enum:
      - asc
      - desc
      default: desc
      description: Sort the results in the ascending/descending order of record creation. Default order is **descending**
        if `sort` is not passed
    ids:
      type: array
      items:
        type: string
      description: Filter by category ids
    name:
      type: string
      description: Filter by category name
    modifiedSince:
      type: string
      description: Filter (urlencoded) the categories modified after a given UTC date-time (YYYY-MM-DDTHH:mm:ss.SSSZ).
        **Prefer to pass your timezone in date-time format for accurate result.**
    createdSince:
      type: string
      description: Filter (urlencoded) the categories created after a given UTC date-time (YYYY-MM-DDTHH:mm:ss.SSSZ).
        **Prefer to pass your timezone in date-time format for accurate result.**
outputs:
  type: object
  required:
  - categories
  - count
  properties:
    categories:
      type: array
      items:
        type: object
        allOf:
        - type: object
          required:
          - createdAt
          - id
          - modifiedAt
          - name
          properties:
            id:
              type: string
              format: string
              description: Category ID for which you requested the details
            name:
              type: string
              format: string
              description: Name of the category for which you requested the details
            createdAt:
              type: string
              description: Creation UTC date-time of the category (YYYY-MM-DDTHH:mm:ss.SSSZ)
            modifiedAt:
              type: string
              description: Last modification UTC date-time of the category (YYYY-MM-DDTHH:mm:ss.SSSZ)
            url:
              type: string
              format: string
              description: URL to the category
            isDeleted:
              type: boolean
              format: string
              description: category deleted from the shop's database
    count:
      type: integer
      format: int64
      description: Number of categories
side_effects:
- 'Expected (from the API docs, not verified): none; read only.'
postcondition_check: HTTP 200 with the requested data.
errors:
- condition: 'HTTP 400: bad request'
  recovery: Fix the request (the response body carries a machine-readable code and message), then retry.
limits: []
depends_on: []
execution:
  preferred: api
  api:
    method: GET
    path: /categories
    auth: api-key header (never store the value).
    operation_id: getCategories
provenance:
  sources:
  - api_docs
  verification: documented_only
  verified_at: '2026-10-22'
  notes: 'Generated from the Brevo public API spec (SDK snapshot, Feb 2025). Not executed: the account had no API
    key. Also present in the live developer-site spec read on 2026-10-22.'
