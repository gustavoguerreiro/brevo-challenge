id: account.list_admin_invitations
domain: account
summary: Get the list of all admin users.
risk: read
reversible: true
requires_human_confirmation: false
plan_availability:
  free: unknown
  note: Master-account (corporate) feature; availability on a Free account was not checked.
preconditions:
- An API key (header api-key) that can access this account.
inputs:
  type: object
  properties: {}
outputs:
  type: object
  properties:
    users:
      type: array
      description: Get invited users list
      items:
        type: object
        required:
        - email
        - feature_access
        - groups
        - is_owner
        - status
        properties:
          groups:
            type: object
            properties:
              id:
                type: string
                description: group id
              name:
                type: string
                description: group name
            description: Admin user groups list
          email:
            type: string
            description: Email address of the user.
          is_owner:
            type: string
            description: Flag for indicating is user owner of the organization.
          status:
            type: string
            description: Status of the invited user.
          feature_access:
            type: object
            properties:
              user_management:
                type: array
                description: User management accessiblity.
                items:
                  type: string
              api_keys:
                type: array
                description: Api keys accessiblity.
                items:
                  type: string
              my_plan:
                type: array
                description: My plan accessiblity.
                items:
                  type: string
              apps_management:
                type: array
                description: Apps management accessiblity | Not available in ENTv2
                items:
                  type: string
            description: Feature accessiblity given to the user. (Required only if status is active)
side_effects:
- 'Expected (from the API docs, not verified): none; read only.'
postcondition_check: HTTP 200 with the requested data.
errors:
- condition: 'HTTP 400: bad request'
  recovery: Fix the request (the response body carries a machine-readable code and message), then retry.
limits: []
depends_on: []
execution:
  preferred: api
  api:
    method: GET
    path: /corporate/invited/users
    auth: api-key header (never store the value).
    operation_id: getCorporateInvitedUsersList
provenance:
  sources:
  - api_docs
  verification: documented_only
  verified_at: '2026-10-22'
  notes: 'Generated from the Brevo public API spec (SDK snapshot, Feb 2025). Not executed: the account had no API
