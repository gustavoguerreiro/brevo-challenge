id: account.list_sub_accounts
domain: account
summary: Get the list of all the sub-accounts of the master account.
risk: read
reversible: true
requires_human_confirmation: false
plan_availability:
  free: unknown
  note: Master-account (corporate) feature; availability on a Free account was not checked.
preconditions:
- An API key (header api-key) that can access this account.
inputs:
  type: object
  properties:
    offset:
      type: integer
      description: Index of the first sub-account in the page
    limit:
      type: integer
      description: Number of sub-accounts to be displayed on each page
  required:
  - limit
  - offset
outputs:
  type: object
  properties:
    count:
      type: integer
      description: Total number of subaccounts
    subAccounts:
      type: array
      items:
        type: object
        required:
        - active
        - companyName
        - createdAt
        - groups
        - id
        properties:
          id:
            type: integer
            format: int64
            description: id of the sub-account
          companyName:
            type: string
            description: Name of the sub-account company
          active:
            type: boolean
            description: Whether the sub-account is active or not
          createdAt:
            type: integer
            format: int64
            description: Timestamp when the sub-account was created
          groups:
            type: array
            description: Group details
            items:
              type: object
              properties:
                id:
                  type: string
                  description: Group identifier
                name:
                  type: string
                  description: Name of the group
side_effects:
- 'Expected (from the API docs, not verified): none; read only.'
postcondition_check: HTTP 200 with the requested data.
errors:
- condition: 'HTTP 400: bad request'
  recovery: Fix the request (the response body carries a machine-readable code and message), then retry.
limits: []
depends_on: []
execution:
  preferred: api
  api:
    method: GET
    path: /corporate/subAccount
    auth: api-key header (never store the value).
provenance:
  sources:
  - api_docs
  verification: documented_only
  verified_at: '2026-10-22'
  notes: 'Generated from the Brevo public API spec (SDK snapshot, Feb 2025). Not executed: the account had no API
    key. Also present in the live developer-site spec read on 2026-10-22.'
