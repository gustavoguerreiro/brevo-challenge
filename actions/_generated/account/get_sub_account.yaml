id: account.get_sub_account
domain: account
summary: Get sub-account details.
risk: read
reversible: true
requires_human_confirmation: false
plan_availability:
  free: unknown
  note: Master-account (corporate) feature; availability on a Free account was not checked.
preconditions:
- An API key (header api-key) that can access this account.
- Path value 'id' must identify an existing record.
inputs:
  type: object
  properties:
    id:
      type: integer
      format: int64
      description: Id of the sub-account organization
  required:
  - id
outputs:
  type: object
  properties:
    name:
      type: string
      description: Name of the sub-account user
    email:
      type: string
      description: Email id of the sub-account organization
    companyName:
      type: string
      description: Sub-account company name
    groups:
      type: array
      description: List of group(s) associated with the sub-account
      items:
        type: object
        properties:
          id:
            type: string
            description: Group id
          name:
            type: string
            description: Name of the group
    planInfo:
      type: object
      properties:
        credits:
          type: object
          properties:
            emails:
              type: object
              properties:
                quantity:
                  type: integer
                  format: int64
                  description: Quantity of email messaging limits provided
                remaining:
                  type: integer
                  format: int64
                  description: Available email messaging limits for use
              description: Email credits remaining on the sub-account
            sms:
              type: object
              properties:
                quantity:
                  type: integer
                  format: int64
                  description: Quantity of SMS messaging limits provided
                remaining:
                  type: integer
                  format: int64
                  description: Available SMS messaging limits for use
              description: SMS credits remaining on the sub-account
            wpSubscribers:
              type: object
              properties:
                quantity:
                  type: integer
                  format: int64
                  description: Quantity of Push sending limits provided
                remaining:
                  type: integer
                  format: int64
                  description: Available Push sending limits for use
              description: Push credits remaining on the sub-account
          description: Credits quota and remaining credits on the sub-account
        features:
          type: object
          properties:
            inbox:
              type: object
              properties:
                quantity:
                  type: integer
                  format: int64
                  description: Quantity of inbox provided
                remaining:
                  type: integer
                  format: int64
                  description: Available inboxes for use
              description: Inbox details / Not available on ENTv2
            landingPage:
              type: object
              properties:
                quantity:
                  type: integer
                  format: int64
                  description: Quantity of landing pages provided
                remaining:
                  type: integer
                  format: int64
                  description: Available landing pages for use
              description: Landing page details / Not available on ENTv2
            users:
              type: object
              properties:
                quantity:
                  type: integer
                  format: int64
                  description: Quantity of multi-account's provided
                remaining:
                  type: integer
                  format: int64
                  description: Available multi-accounts for use
              description: Multi-account details
          description: Features available on the sub-account
        planType:
          type: string
          description: type of the plan
      description: Sub-account plan details
side_effects:
- 'Expected (from the API docs, not verified): none; read only.'
postcondition_check: HTTP 200 with the requested data.
errors:
- condition: Request rejected (any 4xx)
  recovery: Read the response body code and message, fix the request and retry.
limits: []
depends_on: []
execution:
  preferred: api
  api:
    method: GET
    path: /corporate/subAccount/{id}
    auth: api-key header (never store the value).
provenance:
  sources:
  - api_docs
  verification: documented_only
  verified_at: '2026-10-22'
  notes: 'Generated from the Brevo public API spec (SDK snapshot, Feb 2025). Not executed: the account had no API
    key. Also present in the live developer-site spec read on 2026-10-22.'
