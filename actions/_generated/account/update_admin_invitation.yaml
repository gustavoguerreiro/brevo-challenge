id: account.update_admin_invitation
domain: account
summary: Resend / cancel admin user invitation.
risk: external_effect
reversible: false
requires_human_confirmation: true
plan_availability:
  free: unknown
  note: Master-account (corporate) feature; availability on a Free account was not checked.
preconditions:
- An API key (header api-key) that can access this account.
- Path value 'action' must identify an existing record.
- Path value 'email' must identify an existing record.
inputs:
  type: object
  properties:
    action:
      type: string
      description: Action to be performed (cancel / resend)
    email:
      type: string
      description: Email address of the recipient
  required:
  - action
  - email
outputs:
  type: object
  properties:
    message:
      type: string
side_effects:
- 'Expected (from the API docs, not verified): reaches real recipients or third parties and cannot be recalled.'
postcondition_check: HTTP 204 (or 200); read the item back with its get_/list_ action and compare the fields you
  changed.
errors:
- condition: 'HTTP 400: bad request'
  recovery: Fix the request (the response body carries a machine-readable code and message), then retry.
limits: []
depends_on: []
execution:
  preferred: api
  api:
    method: PUT
    path: /corporate/user/invitation/{action}/{email}
    auth: api-key header (never store the value).
provenance:
  sources:
  - api_docs
  verification: documented_only
  verified_at: '2026-10-22'
  notes: 'Generated from the Brevo public API spec (SDK snapshot, Feb 2025). Not executed: the account had no API
