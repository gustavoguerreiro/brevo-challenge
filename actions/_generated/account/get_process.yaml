id: account.get_process
domain: account
summary: Return the informations for a process.
risk: read
reversible: true
requires_human_confirmation: false
plan_availability:
  free: unknown
  note: Plan availability of this API call was not checked.
preconditions:
- An API key (header api-key) that can access this account.
- Path value 'processId' must identify an existing record.
inputs:
  type: object
  properties:
    processId:
      type: integer
      format: int64
      description: Id of the process
  required:
  - processId
outputs:
  type: object
  required:
  - id
  - name
  - status
  properties:
    id:
      type: integer
      format: int64
      description: Id of the process
    status:
      type: string
      description: Status of the process
      enum:
      - queued
      - in_process
      - completed
    name:
      type: string
      description: Process name
    export_url:
      type: string
      description: URL on which send export the of contacts once the process is completed
side_effects:
- 'Expected (from the API docs, not verified): none; read only.'
postcondition_check: HTTP 200 with the requested data.
errors:
- condition: 'HTTP 400: bad request'
  recovery: Fix the request (the response body carries a machine-readable code and message), then retry.
- condition: 'HTTP 404: Process ID not found'
  recovery: The referenced id does not exist; list the parent collection to find a valid id.
limits: []
depends_on: []
execution:
  preferred: api
  api:
    method: GET
    path: /processes/{processId}
    auth: api-key header (never store the value).
    operation_id: getProcess
provenance:
  sources:
  - api_docs
  verification: documented_only
  verified_at: '2026-10-22'
  notes: 'Generated from the Brevo public API spec (SDK snapshot, Feb 2025). Not executed: the account had no API
    key. Also present in the live developer-site spec read on 2026-10-22.'
