id: account.update_sub_account_group
domain: account
summary: Update a group of sub-accounts.
risk: write
reversible: true
requires_human_confirmation: false
plan_availability:
  free: unknown
  note: Master-account (corporate) feature; availability on a Free account was not checked.
preconditions:
- An API key (header api-key) that can access this account.
- Path value 'id' must identify an existing record.
inputs:
  type: object
  properties:
    id:
      type: string
      description: Id of the group
    groupName:
      type: string
      description: The name of the group of sub-accounts
      x-in: body
    subAccountIds:
      type: array
      description: Pass the list of sub-account Ids to be included in the group
      items:
        type: integer
        format: int64
      x-in: body
  required:
  - groupName
  - id
side_effects:
- 'Expected (from the API docs, not verified): changes account data.'
postcondition_check: HTTP 204 (or 200); read the item back with its get_/list_ action and compare the fields you
  changed.
errors:
