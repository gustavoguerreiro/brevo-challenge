id: account.list_dedicated_ips
domain: account
summary: Get all the dedicated IPs for your account.
risk: read
reversible: true
requires_human_confirmation: false
plan_availability:
  free: unknown
  note: Plan availability of this API call was not checked.
preconditions:
- An API key (header api-key) that can access this account.
inputs:
  type: object
  properties: {}
outputs:
  type: object
  required:
  - ips
  properties:
    ips:
      type: array
      description: Dedicated IP(s) available on your account
      items:
        type: object
        required:
        - active
        - domain
        - id
        - ip
        properties:
          id:
            type: integer
            format: int64
            description: ID of the dedicated IP
          ip:
            type: string
            description: Dedicated IP
          active:
            type: boolean
            description: Status of the IP (true=active, false=inactive)
          domain:
            type: string
            description: Domain associated to the IP
side_effects:
- 'Expected (from the API docs, not verified): none; read only.'
postcondition_check: HTTP 200 with the requested data.
errors:
- condition: Request rejected (any 4xx)
  recovery: Read the response body code and message, fix the request and retry.
limits: []
depends_on: []
execution:
  preferred: api
  api:
    method: GET
    path: /senders/ips
    auth: api-key header (never store the value).
    operation_id: getIps
provenance:
  sources:
