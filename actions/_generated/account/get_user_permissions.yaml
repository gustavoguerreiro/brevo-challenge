id: account.get_user_permissions
domain: account
summary: Check user permission.
risk: read
reversible: true
requires_human_confirmation: false
plan_availability:
  free: unknown
  note: Plan availability of this API call was not checked.
preconditions:
- An API key (header api-key) that can access this account.
- Path value 'email' must identify an existing record.
inputs:
  type: object
  properties:
    email:
      type: string
      description: Email of the invited user.
  required:
  - email
outputs:
  type: object
  required:
  - email
  - privileges
  - status
  properties:
    email:
      type: string
      description: Email address of the user.
    status:
      type: string
      description: Status of the invited user.
    privileges:
      type: array
      description: Granular feature permissions given to the user.
      items:
        type: object
        required:
        - feature
        - permissions
        properties:
          feature:
            type: string
          permissions:
            type: array
            items:
              type: string
  description: Check user permission
side_effects:
- 'Expected (from the API docs, not verified): none; read only.'
postcondition_check: HTTP 200 with the requested data.
errors:
- condition: 'HTTP 400: bad request'
  recovery: Fix the request (the response body carries a machine-readable code and message), then retry.
limits: []
depends_on: []
execution:
  preferred: api
  api:
    method: GET
    path: /organization/user/{email}/permissions
    auth: api-key header (never store the value).
    operation_id: getUserPermission
