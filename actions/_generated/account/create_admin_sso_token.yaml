id: account.create_admin_sso_token
domain: account
summary: Generate SSO token to access admin account.
risk: write
reversible: true
requires_human_confirmation: true
plan_availability:
  free: unknown
  note: Master-account (corporate) feature; availability on a Free account was not checked.
preconditions:
- An API key (header api-key) that can access this account.
inputs:
  type: object
  properties:
    email:
      type: string
      description: User email of sub-account organization
      x-in: body
  required:
  - email
outputs:
  type: object
  required:
  - token
  properties:
    token:
      type: string
      description: Session token, it will remain valid for 15 days.
side_effects:
- 'Expected (from the API docs, not verified): Creates a login token for the admin user.'
postcondition_check: HTTP 201 (or 200) returning the new id; read the item back with its get_/list_ action to confirm.
errors:
- condition: 'HTTP 400: bad request'
  recovery: Fix the request (the response body carries a machine-readable code and message), then retry.
- condition: 'HTTP 403: Current account is not an admin account'
  recovery: The key or plan lacks permission for this operation; check key permissions and plan features.
limits: []
depends_on: []
execution:
  preferred: api
  api:
    method: POST
    path: /corporate/ssoToken
    auth: api-key header (never store the value).
provenance:
  sources:
  - api_docs
  verification: documented_only
  verified_at: '2026-10-22'
  notes: 'Generated from the Brevo public API spec (SDK snapshot, Feb 2025). Not executed: the account had no API
    key. Also present in the live developer-site spec read on 2026-10-22.'
description: 'Author''s note (from the docs or from reading the spec; not verified): Creates a login token for the
  admin user.'
