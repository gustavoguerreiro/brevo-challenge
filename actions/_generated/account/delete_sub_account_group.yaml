id: account.delete_sub_account_group
domain: account
summary: Delete a group of sub-accounts of a corporate (master) account.
risk: destructive
reversible: false
requires_human_confirmation: true
plan_availability:
  free: unknown
  note: Master-account (corporate) feature; availability on a Free account was not checked.
preconditions:
- An API key (header api-key) that can access this account.
- Path value 'id' must identify an existing record.
inputs:
  type: object
  properties:
    id:
      type: string
      description: Id of the group
  required:
  - id
side_effects:
- 'Expected (from the API docs, not verified): removes data; the public API documents no undo.'
postcondition_check: HTTP 204 (or 200); then a get_ of the same id should answer 404 (expected, not tested).
errors:
- condition: 'HTTP 400: bad request'
  recovery: Fix the request (the response body carries a machine-readable code and message), then retry.
limits: []
depends_on: []
execution:
  preferred: api
  api:
    method: DELETE
    path: /corporate/group/{id}
    auth: api-key header (never store the value).
provenance:
  sources:
  - api_docs
  verification: documented_only
  verified_at: '2026-10-22'
