id: account.create_sub_account_api_key
domain: account
summary: Create an API key for a sub-account.
risk: write
reversible: true
requires_human_confirmation: true
plan_availability:
  free: unknown
  note: Master-account (corporate) feature; availability on a Free account was not checked.
preconditions:
- An API key (header api-key) that can access this account.
inputs:
  type: object
  properties:
    id:
      type: integer
      format: int64
      description: Id of the sub-account organization
      x-in: body
    name:
      type: string
      description: Name of the API key
      x-in: body
  required:
  - id
outputs:
  type: object
  properties:
    status:
      type: string
      description: Status of the API operation.
    key:
      type: string
      description: API Key
side_effects:
- 'Expected (from the API docs, not verified): Creates a credential; never store the value.'
postcondition_check: HTTP 201 (or 200) returning the new id; read the item back with its get_/list_ action to confirm.
errors:
- condition: 'HTTP 400: bad request'
  recovery: Fix the request (the response body carries a machine-readable code and message), then retry.
limits: []
depends_on: []
execution:
  preferred: api
  api:
    method: POST
    path: /corporate/subAccount/key
    auth: api-key header (never store the value).
provenance:
  sources:
  - api_docs
  verification: documented_only
  verified_at: '2026-10-22'
  notes: 'Generated from the Brevo public API spec (SDK snapshot, Feb 2025). Not executed: the account had no API
    key. Also present in the live developer-site spec read on 2026-10-22.'
description: 'Author''s note (from the docs or from reading the spec; not verified): Creates a credential; never
  store the value.'
