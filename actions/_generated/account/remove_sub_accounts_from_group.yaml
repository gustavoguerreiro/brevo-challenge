id: account.remove_sub_accounts_from_group
domain: account
summary: Delete sub-account from group.
risk: write
reversible: true
requires_human_confirmation: true
plan_availability:
  free: unknown
  note: Master-account (corporate) feature; availability on a Free account was not checked.
preconditions:
- An API key (header api-key) that can access this account.
- Path value 'groupId' must identify an existing record.
inputs:
  type: object
  properties:
    groupId:
      type: string
      description: Id of the group
    subAccountIds:
      type: array
      description: List of sub-account ids
      items:
        type: integer
        format: int64
      x-in: body
  required:
  - groupId
  - subAccountIds
side_effects:
- 'Expected (from the API docs, not verified): changes account data.'
postcondition_check: HTTP 204 (or 200); list the parent collection and confirm the item is gone.
errors:
- condition: 'HTTP 400: bad request'
  recovery: Fix the request (the response body carries a machine-readable code and message), then retry.
limits: []
depends_on: []
execution:
  preferred: api
  api:
    method: PUT
    path: /corporate/group/unlink/{groupId}/subAccounts
    auth: api-key header (never store the value).
provenance:
  sources:
  - api_docs
  verification: documented_only
  verified_at: '2026-10-22'
  notes: 'Generated from the Brevo public API spec (SDK snapshot, Feb 2025). Not executed: the account had no API
