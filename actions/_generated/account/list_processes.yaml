id: account.list_processes
domain: account
summary: Return all the processes for your account.
risk: read
reversible: true
requires_human_confirmation: false
plan_availability:
  free: unknown
  note: Plan availability of this API call was not checked.
preconditions:
- An API key (header api-key) that can access this account.
inputs:
  type: object
  properties:
    limit:
      type: integer
      format: int64
      default: 10
      description: Number limitation for the result returned
    offset:
      type: integer
      format: int64
      default: 0
      description: Beginning point in the list to retrieve from.
    sort:
      type: string
      enum:
      - asc
      - desc
      default: desc
      description: Sort the results in the ascending/descending order of record creation. Default order is **descending**
        if `sort` is not passed
outputs:
  type: object
  properties:
    processes:
      type: array
      description: List of processes available on your account
      items:
        type: object
        required:
        - id
        - name
        - status
        properties:
          id:
            type: integer
            format: int64
            description: Id of the process
          status:
            type: string
            description: Status of the process
            enum:
            - queued
            - in_process
            - completed
          name:
            type: string
            description: Process name
          export_url:
            type: string
            description: URL on which send export the of contacts once the process is completed
    count:
      type: integer
      format: int64
      description: Number of processes available on your account
side_effects:
- 'Expected (from the API docs, not verified): none; read only.'
postcondition_check: HTTP 200 with the requested data.
errors:
- condition: 'HTTP 400: bad request'
  recovery: Fix the request (the response body carries a machine-readable code and message), then retry.
limits: []
depends_on: []
execution:
  preferred: api
  api:
    method: GET
    path: /processes
    auth: api-key header (never store the value).
    operation_id: getProcesses
provenance:
  sources:
  - api_docs
  verification: documented_only
  verified_at: '2026-10-22'
  notes: 'Generated from the Brevo public API spec (SDK snapshot, Feb 2025). Not executed: the account had no API
    key. Also present in the live developer-site spec read on 2026-10-22.'
