id: account.update_sub_account_plan
domain: account
summary: Change the plan (credits and features) of a sub-account of a corporate account.
risk: write
reversible: true
requires_human_confirmation: true
plan_availability:
  free: unknown
  note: Master-account (corporate) feature; availability on a Free account was not checked.
preconditions:
- An API key (header api-key) that can access this account.
- Path value 'id' must identify an existing record.
inputs:
  type: object
  properties:
    id:
      type: integer
      format: int64
      description: Id of the sub-account organization
    credits:
      type: object
      properties:
        email:
          type: integer
          format: int64
          description: Number of email credits
        sms:
          type: number
          format: float
          description: Number of SMS credits | available in ENT-v2 only
        wpSubscribers:
          type: integer
          format: int64
          description: Number of Push credits, possible value is 0 and -1 | available in ENT-v2 only
      description: Credit details to update
      x-in: body
    features:
      type: object
      properties:
        users:
          type: integer
          format: int64
          description: Number of multi-users
        landingPage:
          type: integer
          format: int64
          description: Number of landing pages / Not required on ENTv2
        inbox:
          type: integer
          format: int64
          description: Number of inboxes / Not required on ENTv2
      description: Features details to update
      x-in: body
  required:
  - id
side_effects:
- 'Expected (from the API docs, not verified): changes account data.'
postcondition_check: HTTP 204 (or 200); read the item back with its get_/list_ action and compare the fields you
  changed.
errors:
- condition: 'HTTP 400: bad request'
  recovery: Fix the request (the response body carries a machine-readable code and message), then retry.
- condition: 'HTTP 403: Current account is not a master account'
  recovery: The key or plan lacks permission for this operation; check key permissions and plan features.
limits: []
depends_on: []
execution:
  preferred: api
  api:
    method: PUT
    path: /corporate/subAccount/{id}/plan
    auth: api-key header (never store the value).
provenance:
  sources:
  - api_docs
  verification: documented_only
  verified_at: '2026-10-22'
  notes: 'Generated from the Brevo public API spec (SDK snapshot, Feb 2025). Not executed: the account had no API
    key. Also present in the live developer-site spec read on 2026-10-22.'
description: 'Author''s note (from the docs or from reading the spec; not verified): Changes credits and features
  of a sub-account.'
