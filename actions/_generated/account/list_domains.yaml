id: account.list_domains
domain: account
summary: Get the list of all your domains.
risk: read
reversible: true
requires_human_confirmation: false
plan_availability:
  free: available
preconditions:
- An API key (header api-key) that can access this account.
inputs:
  type: object
  properties: {}
outputs:
  type: object
  properties:
    domains:
      type: array
      description: List of the domains available in your account
      items:
        type: object
        required:
        - authenticated
        - domain_name
        - id
        - verified
        properties:
          id:
            type: integer
            format: int64
            description: Id of the domain
          domain_name:
            type: string
            description: Domain name
          authenticated:
            type: boolean
            description: Status of domain authentication (true=authenticated, false=non authenticated)
          verified:
            type: boolean
            description: Status of domain verification (true=verified, false=non verified)
          ip:
            type: string
            description: Dedicated IP associated with domain
side_effects:
- 'Expected (from the API docs, not verified): none; read only.'
postcondition_check: HTTP 200 with the requested data.
errors:
- condition: 'HTTP 400: bad request'
  recovery: Fix the request (the response body carries a machine-readable code and message), then retry.
limits: []
depends_on: []
execution:
  preferred: api
  api:
    method: GET
    path: /senders/domains
    auth: api-key header (never store the value).
    operation_id: getDomains
  ui:
    entry: /senders/domain/list
    steps:
    - Open Remetentes, domínios e IPs dedicados, tab 'Domínios'. A new account shows the empty state 'Configurar
      seu domínio'.
provenance:
  sources:
  - api_docs
  - ui
  verification: executed_verified
  verified_at: '2026-10-22'
  notes: 'Read in the UI (empty state only). UI view read; field-level equality with the API response was not tested
    (no API key). Generated from the Brevo public API spec (SDK snapshot, Feb 2025). Not executed: the account had
    no API key. Also present in the live developer-site spec read on 2026-10-22.'
  verified_via:
  - ui
  evidence: evidence/ui.read_pages.json
ui_label_pt: Remetentes > Domínios
