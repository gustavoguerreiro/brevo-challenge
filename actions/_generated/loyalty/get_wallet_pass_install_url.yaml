id: loyalty.get_wallet_pass_install_url
domain: loyalty
summary: Get wallet pass install url (GET /wallet/passes/{passId}/installUrl/{contactId}).
risk: read
reversible: true
requires_human_confirmation: false
plan_availability:
  free: blocked
  note: The Loyalty module is gated to an Enterprise plan in the UI (observed). The API calls were not tried; they
    are expected to fail on Free.
preconditions:
- An API key (header api-key) that can access this account.
- Path value 'passId' must identify an existing record.
- Path value 'contactId' must identify an existing record.
inputs:
  type: object
  properties:
    passId:
      description: Type not captured.
      x-in: path
    contactId:
      description: Type not captured.
      x-in: path
  required:
  - contactId
  - passId
side_effects:
- 'Expected (from the API docs, not verified): none; read only.'
postcondition_check: HTTP 200 with the requested data.
errors:
- condition: Request rejected (any 4xx)
  recovery: Read the response body code and message, fix the request and retry.
limits: []
depends_on: []
execution:
  preferred: api
  api:
    method: GET
    path: /wallet/passes/{passId}/installUrl/{contactId}
    auth: api-key header (never store the value).
