  note: Plan availability of this API call was not checked.
preconditions:
- An API key (header api-key) that can access this account.
- Path value 'downloadToken' must identify an existing record.
inputs:
  type: object
  properties:
    downloadToken:
      type: string
      description: Token to fetch a particular attachment
  required:
