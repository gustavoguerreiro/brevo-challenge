id: transactional.get_template
domain: transactional
summary: Returns the template information.
risk: read
reversible: true
requires_human_confirmation: false
plan_availability:
  free: available
preconditions:
- An API key (header api-key) that can access this account.
- Path value 'templateId' must identify an existing record.
inputs:
  type: object
  properties:
    templateId:
      type: integer
      format: int64
      description: id of the template
  required:
  - templateId
outputs:
  type: object
  required:
  - createdAt
  - htmlContent
  - id
  - isActive
  - modifiedAt
  - name
  - replyTo
  - sender
  - subject
  - tag
  - testSent
  - toField
  properties:
    id:
      type: integer
      format: int64
      description: ID of the template
    name:
      type: string
      description: Name of the template
    subject:
      type: string
      description: Subject of the template
    isActive:
      type: boolean
      description: Status of template (true=active, false=inactive)
    testSent:
      type: boolean
      description: Status of test sending for the template (true=test email has been sent, false=test email has
        not been sent)
    sender:
      type: object
      properties:
        name:
          type: string
          description: From email for the template
        email:
          type: string
          format: email
          description: From email for the template
        id:
          type: string
          description: Sender id of the template
    replyTo:
      type: string
      format: email
      description: Email defined as the "Reply to" for the template
    toField:
      type: string
      description: Customisation of the "to" field for the template
    tag:
      type: string
      description: Tag of the template
    htmlContent:
      type: string
      description: HTML content of the template
    createdAt:
      type: string
      description: Creation UTC date-time of the template (YYYY-MM-DDTHH:mm:ss.SSSZ)
    modifiedAt:
      type: string
      description: Last modification UTC date-time of the template (YYYY-MM-DDTHH:mm:ss.SSSZ)
    doiTemplate:
      type: boolean
      description: It is true if template is a valid Double opt-in (DOI) template, otherwise it is false. This field
        will be available only in case of single template detail call.
side_effects:
- 'Expected (from the API docs, not verified): none; read only.'
postcondition_check: HTTP 200 with the requested data.
errors:
- condition: 'HTTP 400: bad request'
  recovery: Fix the request (the response body carries a machine-readable code and message), then retry.
- condition: 'HTTP 404: Template ID not found'
  recovery: The referenced id does not exist; list the parent collection to find a valid id.
limits: []
depends_on: []
execution:
  preferred: api
  api:
    method: GET
    path: /smtp/templates/{templateId}
    auth: api-key header (never store the value).
    operation_id: getSmtpTemplate
  ui:
    entry: /templates/email/edit/<template_id>
    steps:
    - Open the pencil on the list row. The page shows name, status, 'Conteúdo' card (rendered body, button 'Editar'),
      E-mail do remetente, Nome do remetente, Linha de assunto, Pré-visualização do texto and 'Mostrar configuracoes
      avançadas'.
provenance:
  sources:
  - api_docs
  - ui
  verification: executed_verified
  verified_at: '2026-10-22'
  notes: 'Read in the UI. The sender e-mail shown there is the account owner''s address; do not copy it into logs.
    Generated from the Brevo public API spec (SDK snapshot, Feb 2025). Not executed: the account had no API key.
    Also present in the live developer-site spec read on 2026-10-22.'
  verified_via:
  - ui
  evidence: evidence/content.template_lifecycle.json
ui_label_pt: Editor de modelos
