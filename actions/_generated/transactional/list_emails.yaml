id: transactional.list_emails
domain: transactional
summary: Get the list of transactional emails on the basis of allowed filters.
risk: read
reversible: true
requires_human_confirmation: false
plan_availability:
  free: unknown
  note: Plan availability of this API call was not checked.
preconditions:
- An API key (header api-key) that can access this account.
inputs:
  type: object
  properties:
    email:
      type: string
      description: Mandatory if templateId and messageId are not passed in query filters. Email address to which
        transactional email has been sent.
    templateId:
      type: integer
      format: int64
      description: Mandatory if email and messageId are not passed in query filters. Id of the template that was
        used to compose transactional email.
    messageId:
      type: string
      description: Mandatory if templateId and email are not passed in query filters. Message ID of the transactional
        email sent.
    startDate:
      type: string
      description: Mandatory if endDate is used. Starting date (YYYY-MM-DD) from which you want to fetch the list.
        Maximum time period that can be selected is one month.
    endDate:
      type: string
      description: Mandatory if startDate is used. Ending date (YYYY-MM-DD) till which you want to fetch the list.
        Maximum time period that can be selected is one month.
    sort:
      type: string
      enum:
      - asc
      - desc
      default: desc
      description: Sort the results in the ascending/descending order of record creation. Default order is **descending**
        if `sort` is not passed
    limit:
      type: integer
      format: int64
      default: 500
      description: Number of documents returned per page
    offset:
      type: integer
      format: int64
      default: 0
      description: Index of the first document in the page
outputs:
  type: object
  properties:
    count:
      type: integer
      format: int64
      description: Total number of transactional emails available on your account according to the passed filter
    transactionalEmails:
      type: array
      items:
        type: object
        required:
        - date
        - email
        - messageId
        - subject
        - uuid
        properties:
          email:
            type: string
            format: email
            description: Email address to which transactional email has been sent
          subject:
            type: string
            description: Subject of the sent email
          templateId:
            type: integer
            format: int64
            description: Id of the template
          messageId:
            type: string
            description: Message Id of the sent email
          uuid:
            type: string
            description: Unique id of the email sent to a particular contact
          date:
            type: string
            description: Date on which transactional email was sent
          from:
            type: string
            format: email
            description: Email address of the sender from which the email was sent
          tags:
            type: array
            description: Tags used for your email
            items:
              type: string
side_effects:
- 'Expected (from the API docs, not verified): none; read only.'
postcondition_check: HTTP 200 with the requested data.
errors:
- condition: 'HTTP 400: bad request'
  recovery: Fix the request (the response body carries a machine-readable code and message), then retry.
limits: []
depends_on: []
execution:
  preferred: api
  api:
    method: GET
    path: /smtp/emails
    auth: api-key header (never store the value).
    operation_id: getTransacEmailsList
provenance:
  sources:
  - api_docs
  verification: documented_only
  verified_at: '2026-10-22'
  notes: 'Generated from the Brevo public API spec (SDK snapshot, Feb 2025). Not executed: the account had no API
    key. Also present in the live developer-site spec read on 2026-10-22.'
