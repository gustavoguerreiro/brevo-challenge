id: transactional.update_template
domain: transactional
summary: Change a transactional e-mail template (name, subject, sender, body or active state).
risk: write
reversible: true
requires_human_confirmation: false
plan_availability:
  free: available
preconditions:
- An API key (header api-key) that can access this account.
- Path value 'templateId' must identify an existing record.
inputs:
  type: object
  properties:
    templateId:
      type: integer
      format: int64
      description: id of the template
    tag:
      type: string
      description: Tag of the template
      x-in: body
    sender:
      type: object
      properties:
        name:
          type: string
          description: Name of the sender
        email:
          type: string
          format: email
          description: Email of the sender
        id:
          type: integer
          format: int64
          description: Select the sender for the template on the basis of sender id. In order to select a sender
            with specific pool of IP’s, dedicated ip users shall pass id (instead of email).
      description: Sender details including id or email and name (optional). Only one of either Sender's email or
        Sender's ID shall be passed in one request at a time. For example `{"name":"xyz", "email":"example@abc.com"}`
        , `{"name":"xyz", "id":123}`
      x-in: body
    templateName:
      type: string
      description: Name of the template
      x-in: body
    htmlContent:
      type: string
      description: Required if htmlUrl is empty. If the template is designed using Drag & Drop editor via HTML content,
        then the design page will not have Drag & Drop editor access for that template. Body of the message (HTML
        must have more than 10 …
      x-in: body
    htmlUrl:
      type: string
      format: url
      description: Required if htmlContent is empty. URL to the body of the email (HTML)
      x-in: body
    subject:
      type: string
      description: Subject of the email
      x-in: body
    replyTo:
      type: string
      format: email
      description: Email on which campaign recipients will be able to reply to
      x-in: body
    toField:
      type: string
      description: To personalize the «To» Field. If you want to include the first name and last name of your recipient,
        add {FNAME} {LNAME}. These contact attributes must already exist in your Brevo account. If input parameter
        'params' used please use …
      x-in: body
    attachmentUrl:
      type: string
      format: url
      description: 'Absolute url of the attachment (no local file). Extension allowed: xlsx, xls, ods, docx, docm,
        doc, csv, pdf, txt, gif, jpg, jpeg, png, tif, tiff, rtf, bmp, cgm, css, shtml, html, htm, zip, xml, ppt,
        pptx, tar, ez, ics, mobi, msg, pub and …'
      x-in: body
    isActive:
      type: boolean
      description: Status of the template. isActive = false means template is inactive, isActive = true means template
        is active
      x-in: body
  required:
  - templateId
side_effects:
- 'Expected (from the API docs, not verified): changes account data.'
postcondition_check: HTTP 204 (or 200); read the item back with its get_/list_ action and compare the fields you
  changed.
errors:
- condition: 'HTTP 400: bad request'
  recovery: Fix the request (the response body carries a machine-readable code and message), then retry.
- condition: 'HTTP 404: Template ID not found'
  recovery: The referenced id does not exist; list the parent collection to find a valid id.
limits: []
depends_on: []
execution:
  preferred: api
  api:
    method: PUT
    path: /smtp/templates/{templateId}
    auth: api-key header (never store the value).
    operation_id: updateSmtpTemplate
  ui:
    entry: /templates/email/edit/<template_id>
    steps:
    - 'Open /templates/email/edit/<id>. Edit the name with the pencil, the subject in ''Linha de assunto'', the
      sender fields, then ''Salvar'' (menu: Salvar, Salvar e ativar).'
    - To replace the body use 'Adicionar conteúdo' or 'Editar' on the card 'Conteúdo' (see content.update_email_template_content)
      and 'Salvar e Sair' in the editor.
provenance:
  sources:
  - api_docs
  - ui
  verification: executed_verified
  verified_at: '2026-10-22'
  notes: 'UI equivalent verified for the body and for the first save. The API call itself was not executed. Subject
    and sender edits were not changed in this test. Generated from the Brevo public API spec (SDK snapshot, Feb
    2025). Not executed: the account had no API key. Also present in the live developer-site spec read on 2026-10-22.'
  verified_via:
  - ui
  evidence: evidence/content.template_lifecycle.json
related:
- content.update_email_template_content
- content.activate_email_template
- content.deactivate_email_template
ui_label_pt: Adicionar conteúdo > Código HTML personalizado
