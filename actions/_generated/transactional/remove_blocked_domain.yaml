id: transactional.remove_blocked_domain
domain: transactional
summary: Unblock an existing domain from the list of blocked domains.
risk: write
reversible: true
requires_human_confirmation: true
plan_availability:
  free: unknown
  note: Plan availability of this API call was not checked.
preconditions:
