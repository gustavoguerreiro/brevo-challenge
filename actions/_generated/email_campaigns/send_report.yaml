id: email_campaigns.send_report
domain: email_campaigns
summary: Send the report of a campaign.
risk: external_effect
reversible: false
requires_human_confirmation: true
plan_availability:
  free: unknown
  note: Plan availability of this API call was not checked.
preconditions:
- An API key (header api-key) that can access this account.
- Path value 'campaignId' must identify an existing record.
inputs:
  type: object
  properties:
    campaignId:
      type: integer
      format: int64
      description: Id of the campaign
    language:
      type: string
      description: Language of email content for campaign report sending.
      enum:
      - fr
      - es
      - pt
      - it
      - de
      - en
      default: fr
      x-in: body
    email:
      type: object
      required:
      - body
      - to
      properties:
        to:
          type: array
          description: Email addresses of the recipients
          items:
            type: string
            format: email
            description: Email address of the recipient
        body:
          type: string
          description: Custom text message to be presented in the report email.
      description: Custom attributes for the report email.
      x-in: body
  required:
  - campaignId
  - email
side_effects:
- 'Expected (from the API docs, not verified): The campaign report is e-mailed to the given addresses.'
- 'Expected (from the API docs, not verified): reaches real recipients or third parties and cannot be recalled.'
postcondition_check: HTTP 2xx with a message id or empty body; confirm delivery in the matching logs or statistics
  action.
errors:
- condition: 'HTTP 400: bad request'
  recovery: Fix the request (the response body carries a machine-readable code and message), then retry.
- condition: 'HTTP 404: Campaign ID not found'
  recovery: The referenced id does not exist; list the parent collection to find a valid id.
limits: []
depends_on: []
execution:
  preferred: api
  api:
    method: POST
    path: /emailCampaigns/{campaignId}/sendReport
    auth: api-key header (never store the value).
    operation_id: sendReport
provenance:
  sources:
  - api_docs
  verification: documented_only
  verified_at: '2026-10-22'
  notes: 'Generated from the Brevo public API spec (SDK snapshot, Feb 2025). Not executed: the account had no API
    key. Also present in the live developer-site spec read on 2026-10-22.'
description: 'Author''s note (from the docs or from reading the spec; not verified): E-mails the campaign report
  to the given addresses.'
