id: email_campaigns.update_campaign
domain: email_campaigns
summary: Edit an e-mail campaign; with a schedule field and recipients set it schedules a real send.
risk: external_effect
reversible: false
requires_human_confirmation: true
plan_availability:
  free: unknown
  note: Plan availability of this API call was not checked.
preconditions:
- An API key (header api-key) that can access this account.
- Path value 'campaignId' must identify an existing record.
inputs:
  type: object
  properties:
    campaignId:
      type: integer
      format: int64
      description: Id of the campaign
    tag:
      type: string
      description: Tag of the campaign
      x-in: body
    sender:
      type: object
      properties:
        name:
          type: string
          description: Sender Name from which the campaign emails are sent
        email:
          type: string
          format: email
          description: Sender email from which the campaign emails are sent
        id:
          type: integer
          format: int64
          description: Select the sender for the campaign on the basis of sender id. In order to select a sender
            with specific pool of IP’s, dedicated ip users shall pass id (instead of email).
      description: Sender details including id or email and name (optional). Only one of either Sender's email or
        Sender's ID shall be passed in one request at a time. For example `{"name":"xyz", "email":"example@abc.com"}`
        , `{"name":"xyz", "id":123}`
      x-in: body
    name:
      type: string
      description: Name of the campaign
      x-in: body
    htmlContent:
      type: string
      description: Body of the message (HTML version). If the campaign is designed using Drag & Drop editor via
        HTML content, then the design page will not have Drag & Drop editor access for that campaign. REQUIRED if
        htmlUrl is empty
      x-in: body
    htmlUrl:
      type: string
      format: url
      description: Url which contents the body of the email message. REQUIRED if htmlContent is empty
      x-in: body
    scheduledAt:
      type: string
      description: UTC date-time on which the campaign has to run (YYYY-MM-DDTHH:mm:ss.SSSZ). Prefer to pass your
        timezone in date-time format for accurate result. If sendAtBestTime is set to true, your campaign will be
        sent according to the date passed …
      x-in: body
    subject:
      type: string
      description: Subject of the campaign
      x-in: body
    previewText:
      type: string
      description: Preview text or preheader of the email campaign
      x-in: body
    replyTo:
      type: string
      format: email
      description: Email on which campaign recipients will be able to reply to
      x-in: body
    toField:
      type: string
      description: To personalize the «To» Field. If you want to include the first name and last name of your recipient,
        add {FNAME} {LNAME}. These contact attributes must already exist in your Brevo account. If input parameter
        'params' used please use …
      x-in: body
    recipients:
      type: object
      properties:
        exclusionListIds:
          type: array
          description: List ids which have to be excluded from a campaign
          items:
            type: integer
            format: int64
        listIds:
          type: array
          description: Lists Ids to send the campaign to. Campaign should only be updated with listIds if listIds
            were used to create it. REQUIRED if already not present in campaign and scheduledAt is not empty
          items:
            type: integer
            format: int64
        segmentIds:
          type: array
          description: Mandatory if listIds are not used. Campaign should only be updated with segmentIds if segmentIds
            were used to create it. Segment ids to send the campaign to.
          items:
            type: integer
            format: int64
      description: Segment ids and List ids to include/exclude from campaign
      x-in: body
    attachmentUrl:
      type: string
      format: url
      description: 'Absolute url of the attachment (no local file). Extension allowed: xlsx, xls, ods, docx, docm,
        doc, csv, pdf, txt, gif, jpg, jpeg, png, tif, tiff, rtf, bmp, cgm, css, shtml, html, htm, zip, xml, ppt,
        pptx, tar, ez, ics, mobi, msg, pub and …'
      x-in: body
    inlineImageActivation:
      type: boolean
      description: Status of inline image. inlineImageActivation = false means image can’t be embedded, & inlineImageActivation
        = true means image can be embedded, in the email. You cannot send a campaign of more than 4MB with images
        embedded in the email. …
      default: false
      x-in: body
    mirrorActive:
      type: boolean
      description: Status of mirror links in campaign. mirrorActive = false means mirror links are deactivated,
        & mirrorActive = true means mirror links are activated, in the campaign
      x-in: body
    recurring:
      type: boolean
      description: FOR TRIGGER ONLY ! Type of trigger campaign.recurring = false means contact can receive the same
        Trigger campaign only once, & recurring = true means contact can receive the same Trigger campaign several
        times
      default: false
      x-in: body
    footer:
      type: string
      description: Footer of the email campaign
      x-in: body
    header:
      type: string
      description: Header of the email campaign
      x-in: body
    utmCampaign:
      type: string
      description: Customize the utm_campaign value. If this field is empty, the campaign name will be used. Only
        alphanumeric characters and spaces are allowed
      x-in: body
    params:
      type: object
      description: Pass the set of attributes to customize the type 'classic' campaign. For example, {"FNAME":"Joe",
        "LNAME":"Doe"}. The 'params' field will get updated, only if the campaign is in New Template Language, else
        ignored. The New Template …
      properties: {}
      x-in: body
    sendAtBestTime:
      type: boolean
      description: Set this to true if you want to send your campaign at best time. Note:- if true, warmup ip will
        be disabled.
      x-in: body
    abTesting:
      type: boolean
      description: Status of A/B Test. abTesting = false means it is disabled, & abTesting = true means it is enabled.
        'subjectA', 'subjectB', 'splitRule', 'winnerCriteria' & 'winnerDelay' will be considered if abTesting is
        set to true. 'subject' if passed …
      default: false
      x-in: body
    subjectA:
      type: string
      description: Subject A of the campaign. Considered if abTesting = true. subjectA & subjectB should have unique
        value
      x-in: body
    subjectB:
      type: string
      description: Subject B of the campaign. Considered if abTesting = true. subjectA & subjectB should have unique
        value
      x-in: body
    splitRule:
      type: integer
      format: int64
      description: Add the size of your test groups. Considered if abTesting = true. We'll send version A and B
        to a random sample of recipients, and then the winning version to everyone else
      minimum: 1
      maximum: 50
      x-in: body
    winnerCriteria:
      type: string
      description: Choose the metrics that will determinate the winning version. Considered if 'splitRule' >= 1
        and < 50. If splitRule = 50, 'winnerCriteria' is ignored if passed or alreday exist in record
      enum:
      - open
      - click
      x-in: body
    winnerDelay:
      type: integer
      format: int64
      description: Choose the duration of the test in hours. Maximum is 7 days, pass 24*7 = 168 hours. The winning
        version will be sent at the end of the test. Considered if 'splitRule' >= 1 and < 50. If splitRule = 50,
        'winnerDelay' is ignored if passed or …
      minimum: 1
      maximum: 168
      x-in: body
    ipWarmupEnable:
      type: boolean
      description: Available for dedicated ip clients. Set this to true if you wish to warm up your ip.
      default: false
      x-in: body
    initialQuota:
      type: integer
      format: int64
      description: Set an initial quota greater than 1 for warming up your ip. We recommend you set a value of 3000.
      x-in: body
    increaseRate:
      type: integer
      format: int64
      description: Set a percentage increase rate for warming up your ip. We recommend you set the increase rate
        to 30% per day. If you want to send the same number of emails every day, set the daily increase value to
        0%.
      minimum: 0
      maximum: 100
      x-in: body
    unsubscriptionPageId:
      type: string
      description: Enter an unsubscription page id. The page id is a 24 digit alphanumeric id that can be found
        in the URL when editing the page.
      x-in: body
    updateFormId:
      type: string
      description: Mandatory if templateId is used containing the {{ update_profile }} tag. Enter an update profile
        form id. The form id is a 24 digit alphanumeric id that can be found in the URL when editing the form.
      x-in: body
  required:
  - campaignId
side_effects:
- 'Expected (from the API docs, not verified): If scheduledAt is set on a campaign that has recipients, the campaign
  is scheduled to send.'
- 'Expected (from the API docs, not verified): reaches real recipients or third parties and cannot be recalled.'
postcondition_check: HTTP 204 (or 200); read the item back with its get_/list_ action and compare the fields you
  changed.
errors:
- condition: 'HTTP 400: bad request'
  recovery: Fix the request (the response body carries a machine-readable code and message), then retry.
- condition: 'HTTP 404: Campaign ID not found'
  recovery: The referenced id does not exist; list the parent collection to find a valid id.
limits: []
depends_on: []
execution:
  preferred: api
  api:
    method: PUT
    path: /emailCampaigns/{campaignId}
    auth: api-key header (never store the value).
    operation_id: updateEmailCampaign
provenance:
  sources:
  - api_docs
  verification: documented_only
  verified_at: '2026-10-22'
  notes: 'Generated from the Brevo public API spec (SDK snapshot, Feb 2025). Not executed: the account had no API
    key. Also present in the live developer-site spec read on 2026-10-22.'
description: 'Author''s note (from the docs or from reading the spec; not verified): Marked external_effect because
  this call carries scheduledAt and sendAtBestTime: with recipients set it schedules a real send. Without those
  fields it only edits the draft; still ask for a yes before sending the call.'
